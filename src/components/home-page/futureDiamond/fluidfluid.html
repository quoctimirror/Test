<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Metaballs — Canvas (Single HTML)</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #05060a; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud {
      position: fixed; left: 14px; bottom: 14px; color: #aab6ff; font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: rgba(12,14,24,.45); border: 1px solid rgba(120,160,255,.2); padding: 10px 12px; border-radius: 12px; backdrop-filter: blur(6px);
      user-select: none; pointer-events: none;
    }
    .hud b { color: #dfe2ff; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud"> <b>Neon Metaballs</b> — WebGL on &lt;canvas&gt;<br/>
    Drag to stir / attract. Press <b>space</b> to pause, <b>S</b> to save PNG.<br/>
    Tweak constants at the top of the script for different looks.
  </div>

<script>
(() => {
  // ======= CONFIG =======
  const CONFIG = {
    BLOB_COUNT: 13,          // number of moving blobs (not counting mouse)
    BASE_RADIUS: [0.45, 0.72], // min/max radius in normalized units (relative to canvas height)
    SPEED: [0.15, 0.55],     // angular speed range (radians/sec)
    INTENSITY: [0.8, 1.2],   // multiplier per blob
    DPR_MAX: 1.75,           // clamp devicePixelRatio for performance
    EDGE_SHARPNESS: 1.65,    // higher = crisper edges
    BG_COLOR: [0.08, 0.08, 0.08],
  };

  // ======= GL SETUP =======
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false });
  if (!gl) {
    alert('WebGL not supported on this browser.');
    return;
  }

  const DPR = Math.min(window.devicePixelRatio || 1, CONFIG.DPR_MAX);
  function resize() {
    const w = Math.floor(window.innerWidth * DPR);
    const h = Math.floor(window.innerHeight * DPR);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  addEventListener('resize', resize, { passive: true });
  resize();

  // ======= SHADERS =======
  const vertSrc = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;       // map [-1,1] -> [0,1]
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  // Inigo Quilez style palette helper
  const fragSrc = `
    precision highp float;
    varying vec2 v_uv;
    uniform vec2 u_res;              // pixel resolution
    uniform float u_time;            // time in seconds
    uniform int u_count;             // how many balls are active
    uniform vec4 u_balls[32];        // xy in [0,1], z radius (norm to height), w intensity
    uniform vec3 u_bg;
    uniform float u_edgeSharp;

    // Inigo Quilez style palette helper
    vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
      return a + b * cos(6.2831853 * (c * t + d));
    }

    // Compute the scalar field value at point p (aspect-corrected space)
    float fieldAt(vec2 p) {
      float f = 0.0;
      for (int i = 0; i < 32; i++) {
        if (i >= u_count) break;
        vec4 b = u_balls[i];
        vec2 bp = b.xy - 0.5;  // to centered space
        bp.x *= u_res.x / u_res.y;
        float r = max(0.0001, b.z);
        float d = length(p - bp);
        float contrib = exp(-pow(d / r, 2.0) * 2.0) * b.w;
        f += contrib;
      }
      return f;
    }

    void main() {
      // Convert uv to aspect-corrected space so circles stay round.
      vec2 uv = v_uv;
      vec2 p = uv - 0.5;
      p.x *= u_res.x / u_res.y;

      float field = fieldAt(p);
      // Normalize field roughly to [0,1]
      float t = clamp(field, 0.0, 1.0);

      // Edge enhancement using finite differences (portable: no dFdx/dFdy needed)
      float eps = 1.0 / min(u_res.x, u_res.y);
      float fx = fieldAt(p + vec2(eps, 0.0)) - field;
      float fy = fieldAt(p + vec2(0.0, eps)) - field;
      float g = length(vec2(fx, fy));
      float edge = pow(clamp(1.0 - smoothstep(0.4, 2.0, g * 180.0 * u_edgeSharp), 0.0, 1.0), 1.1);

      // Neon palette (tuned for warm oranges/reds)
      vec3 base = pal(t,
        vec3(0.20, 0.10, 0.05),  // a: base - warm orange base
        vec3(0.70, 0.50, 0.30),  // b: amplitude - orange/red range
        vec3(0.15, 0.25, 0.20),  // c: frequency - smoother transitions
        vec3(0.10, 0.20, 0.40)   // d: phase - shift toward orange/red
      );

      // Add edge glow and subtle vignette
      float vign = pow(16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y), 0.22);
      vec3 col = mix(u_bg, base, 0.85) + edge * vec3(2.0, 1.2, 0.6);
      col *= (0.55 + 0.45 * vign);

      // Gamma-ish tweak
      col = pow(max(col, 0.0), vec3(0.9));
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error('Shader compile error:\n' + info);
    }
    return sh;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const info = gl.getProgramInfoLog(p);
      gl.deleteProgram(p);
      throw new Error('Program link error:\n' + info);
    }
    return p;
  }

  const prog = program(vertSrc, fragSrc);
  gl.useProgram(prog);

  // Fullscreen triangle (two tris quad also fine)
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([
      -1, -1,  3, -1,  -1,  3, // big tri trick
    ]),
    gl.STATIC_DRAW
  );
  const a_pos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(a_pos);
  gl.vertexAttribPointer(a_pos, 2, gl.FLOAT, false, 0, 0);

  // Uniforms
  const u_res = gl.getUniformLocation(prog, 'u_res');
  const u_time = gl.getUniformLocation(prog, 'u_time');
  const u_count = gl.getUniformLocation(prog, 'u_count');
  const u_balls = gl.getUniformLocation(prog, 'u_balls');
  const u_bg = gl.getUniformLocation(prog, 'u_bg');
  const u_edgeSharp = gl.getUniformLocation(prog, 'u_edgeSharp');

  gl.uniform3fv(u_bg, new Float32Array(CONFIG.BG_COLOR));
  gl.uniform1f(u_edgeSharp, CONFIG.EDGE_SHARPNESS);

  // ======= BALLS =======
  const MAX = 32;
  const count = Math.min(CONFIG.BLOB_COUNT, MAX - 1); // reserve one slot for mouse

  function randSeeded(i, a=12.9898, b=78.233, c=43758.5453123) {
    // deterministic pseudo-rand from index
    const s = Math.sin(i * a + b) * c;
    return s - Math.floor(s);
  }
  function lerp(a, b, t){ return a + (b - a) * t; }

  const blobs = [];
  for (let i = 0; i < count; i++) {
    const r = lerp(CONFIG.BASE_RADIUS[0], CONFIG.BASE_RADIUS[1], randSeeded(i+1));
    const sp = lerp(CONFIG.SPEED[0], CONFIG.SPEED[1], randSeeded(i+2));
    const inten = lerp(CONFIG.INTENSITY[0], CONFIG.INTENSITY[1], randSeeded(i+3));
    const ax = 0.23 + 0.22 * randSeeded(i+4);  // x amplitude
    const ay = 0.23 + 0.22 * randSeeded(i+5);  // y amplitude
    const phx = randSeeded(i+6) * Math.PI * 2;
    const phy = randSeeded(i+7) * Math.PI * 2;
    const dir = randSeeded(i+8) > 0.5 ? 1 : -1;
    blobs.push({ r, sp, inten, ax, ay, phx, phy, dir });
  }

  // Mouse-controlled blob
  const mouse = { x: 0.5, y: 0.5, r: 0.11, inten: 1.15, active: false, vx: 0, vy: 0 };
  let isPaused = false;

  function onPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    mouse.vx = x - mouse.x; mouse.vy = y - mouse.y;
    mouse.x = x; mouse.y = y; mouse.active = true;
  }
  addEventListener('pointermove', onPointer, { passive: true });
  addEventListener('pointerdown', onPointer, { passive: true });
  addEventListener('pointerleave', () => { mouse.active = false; }, { passive: true });

  addEventListener('keydown', (e) => {
    if (e.key === ' ') { isPaused = !isPaused; }
    if (e.key.toLowerCase() === 's') savePNG();
  });

  function savePNG() {
    const link = document.createElement('a');
    link.download = 'neon-metaballs.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // ======= RENDER LOOP =======
  const ballsData = new Float32Array(MAX * 4);
  let start = performance.now();

  function frame() {
    if (!isPaused) {
      const now = performance.now();
      const t = (now - start) / 1000;

      // animate procedural blobs (Lissajous-ish orbits)
      for (let i = 0; i < count; i++) {
        const b = blobs[i];
        const x = 0.5 + b.ax * Math.cos((t * b.sp * 0.9 + b.phx) * b.dir);
        const y = 0.5 + b.ay * Math.sin((t * b.sp * 1.1 + b.phy) * b.dir);
        const off = i * 4;
        ballsData[off+0] = x;
        ballsData[off+1] = y;
        ballsData[off+2] = b.r;
        ballsData[off+3] = b.inten;
      }

      // mouse-driven blob in the last slot
      const mSlot = count * 4;
      const speed = Math.hypot(mouse.vx, mouse.vy);
      // radius expands a bit with motion
      const r = mouse.active ? Math.min(0.16, mouse.r + speed * 0.35) : Math.max(0.08, mouse.r * 0.985);
      mouse.r = r; mouse.vx *= 0.85; mouse.vy *= 0.85;

      ballsData[mSlot+0] = mouse.x;
      ballsData[mSlot+1] = mouse.y;
      ballsData[mSlot+2] = mouse.r;
      ballsData[mSlot+3] = mouse.active ? mouse.inten : mouse.inten * 0.75;

      // uniforms & draw
      gl.uniform2f(u_res, canvas.width, canvas.height);
      gl.uniform1f(u_time, t);
      gl.uniform1i(u_count, count + 1);
      gl.uniform4fv(u_balls, ballsData);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(frame);
  }

  // Kick off
  gl.clearColor(CONFIG.BG_COLOR[0], CONFIG.BG_COLOR[1], CONFIG.BG_COLOR[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  frame();
})();
</script>
</body>
</html>
