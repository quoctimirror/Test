<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas Carousel — Blink Swap + Right Slide-In</title>
<style>
  :root{
    --bg: #f3f4f6;
    --ink: #0e1116;
    --gap: clamp(18px, 2.2vw, 36px);
    --radius: 18px;
    --shadow: 0 18px 36px rgba(0,0,0,.20), 0 2px 8px rgba(0,0,0,.10);
    --cycle-ms: 5000;   /* shift every 5s */
    --anim-ms: 950;     /* animation length */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;overflow:hidden}
  .chrome{position:fixed;inset:0;display:grid;place-items:center;padding:clamp(12px,2.4vmin,24px)}
  .stage-wrap{width:min(94vw,1400px);height:min(86vh,820px);position:relative}
  canvas#stage{width:100%;height:100%;display:block;background:#eef1f5;border-radius:28px;box-shadow:var(--shadow)}
  .hint{position:fixed;left:16px;bottom:12px;font-size:12px;opacity:.6}
</style>
</head>
<body>
  <div class="chrome"><div class="stage-wrap"><canvas id="stage"></canvas></div></div>
  <div class="hint">1st slides left and vanishes; at the same time a new card slides in from the right into slot #5. 2nd-from-left stays the largest.</div>
<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // Demo visuals (replace with real URLs if needed)
  const images = [
    { colors:['#1f2937','#111827'] },
    { colors:['#b3272b','#6a0f12'] },
    { colors:['#a18cd1','#6c5a99'] },
    { colors:['#84fab0','#3da2c7'] },
    { colors:['#c9cf9c','#768054'] },
  ];

  async function makeBitmap({colors}){
    const off = document.createElement('canvas');
    off.width=1600; off.height=2000; // 4:5
    const c = off.getContext('2d');
    const g = c.createLinearGradient(0,0,off.width,off.height);
    g.addColorStop(0,colors[0]); g.addColorStop(1,colors[1]);
    c.fillStyle=g; c.fillRect(0,0,off.width,off.height);
    const vg=c.createRadialGradient(off.width*.5,off.height*.4,off.width*.1,off.width*.5,off.height*.5,off.width*.7);
    vg.addColorStop(0,'rgba(255,255,255,0)'); vg.addColorStop(1,'rgba(0,0,0,.22)');
    c.fillStyle=vg; c.fillRect(0,0,off.width,off.height);
    return await createImageBitmap(off);
  }

  const S={ bitmaps:[], order:[0,1,2,3,4], t:0, anim:false, last:0, lastShift:0 };

  function resize(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const r=canvas.getBoundingClientRect();
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize, {passive:true});

  // 5 layout slots + offscreen in/out
  function slots(){
    const W=canvas.clientWidth, H=canvas.clientHeight;
    const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||24;
    const baseH=Math.min(H*0.62,520);
    const baseW=baseH*(4/5);
    const scale=[0.96,1.24,1.0,0.98,0.94];
    const widths=scale.map(s=>baseW*s), heights=scale.map(s=>baseH*s);
    const totalW=widths.reduce((a,b)=>a+b,0)+gap*4;
    const left=Math.max(24,(W-totalW)/2);
    const yBase=Math.max(24,(H-baseH*1.28)/2);
    let x=left; const out=[];
    for(let i=0;i<5;i++){
      const w=widths[i], h=heights[i];
      const y=yBase+(heights[1]-h); // bottom-align to tallest (index 1)
      out.push({x,y,w,h,sat:i===1?1:0,z:i===1?2:1});
      x+=w+gap;
    }
    const pad=60; // extra offscreen distance for cleaner vanish/enter
    out.offL={x: out[0].x - (out[0].w + gap + pad), y: out[0].y, w: out[0].w, h: out[0].h, sat:0, z:0};
    out.offR={x: out[4].x + (out[4].w + gap + pad), y: out[4].y, w: out[4].w, h: out[4].h, sat:0, z:0};
    return out;
  }

  const ease = t => 1 - Math.pow(1 - t, 3); // easeOutCubic
  function lerp(a,b,t){ return a+(b-a)*t; }
  function lerpRect(a,b,t){ return { x: lerp(a.x,b.x,t), y: lerp(a.y,b.y,t), w: lerp(a.w,b.w,t), h: lerp(a.h,b.h,t), sat: lerp(a.sat,b.sat,t), z: lerp(a.z,b.z,t) }; }
  function rrPath(x,y,w,h,r){ const rr=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr); ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }
  function drawRounded(img,x,y,w,h,r){ ctx.save(); rrPath(x,y,w,h,r); ctx.clip(); ctx.drawImage(img,x,y,w,h); ctx.restore(); }

  function render(ts){
    if(!S.last) S.last=ts; const dt=ts-S.last; S.last=ts;
    const L=slots();

    // trigger cycle
    if(!S.anim && (ts - S.lastShift) > parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cycle-ms'))){
      S.anim=true; S.t=0; S.lastShift=ts;
    }

    if(S.anim){
      const dur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--anim-ms'));
      S.t=Math.min(1, S.t + dt/dur);
      if(S.t>=1){ S.anim=false; S.t=0; const first=S.order.shift(); S.order.push(first); }
    }

    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

    // Build draw list
    const items=[];
    for(let vis=0; vis<5; vis++){
      const idx=S.order[vis];
      const from=L[vis];
      let to;
      if(!S.anim){
        to=L[vis];
      } else if(vis===0){
        to=L.offL; // first slides left to offscreen
      } else {
        to=L[vis-1]; // others shift left
      }
      const R=S.anim? lerpRect(from,to,ease(S.t)) : to;
      const isSpot = (!S.anim && vis===1) || (S.anim && (vis-1)===1);
      items.push({img:S.bitmaps[idx], R, isSpot});
    }

    // Extra: incoming ghost card from right (content = current first card)
    if(S.anim){
      const idxGhost = S.order[0]; // the card that will end up on the right after commit
      const fromG = L.offR;
      const toG   = L[4];
      const RG = lerpRect(fromG, toG, ease(S.t));
      items.push({img:S.bitmaps[idxGhost], R: RG, isSpot: false, ghost: true, Rz: 1.5});
    }

    // depth (spotlight/ghost above regular)
    items.sort((a,b)=> (a.R.z||0) - (b.R.z||0));

    for(const it of items){
      const r=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--radius'))||18;
      // shadow
      ctx.save(); ctx.shadowColor='rgba(0,0,0,.22)'; ctx.shadowBlur=28; ctx.shadowOffsetY=16; rrPath(it.R.x,it.R.y,it.R.w,it.R.h,r); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
      // image (spotlight full color, others grayscale)
      const sat = it.isSpot ? 1 : it.R.sat;
      ctx.save(); ctx.filter=`saturate(${sat.toFixed(2)}) contrast(1.02)`; drawRounded(it.img,it.R.x,it.R.y,it.R.w,it.R.h,r); ctx.restore();
      // inner stroke
      ctx.save(); ctx.globalAlpha=.7; ctx.strokeStyle='rgba(255,255,255,.34)'; ctx.lineWidth=1; rrPath(it.R.x+.5,it.R.y+.5,it.R.w-1,it.R.h-1,r-1); ctx.stroke(); ctx.restore();
    }

    requestAnimationFrame(render);
  }

  async function init(){
    resize();
    for(let i=0;i<images.length;i++){ S.bitmaps[i] = await makeBitmap(images[i]); }
    requestAnimationFrame(render);
  }
  init();
})();
</script>
</body>
</html>
