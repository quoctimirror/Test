<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Ring Viewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }

        #webgi-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #fff;
            opacity: 0.9;
        }

        .control-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .gem-color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .gem-color:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .material-btn {
            min-width: 60px;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-text {
            font-size: 24px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .progress-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .controls {
                top: 10px;
                left: 10px;
                right: 10px;
            }
            
            .control-group {
                padding: 10px;
            }
            
            .info-panel {
                bottom: 10px;
                right: 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="loader-text">🔄 Đang tải nhẫn...</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- WebGL Canvas -->
    <canvas id="webgi-canvas"></canvas>

    <!-- Controls -->
    <div class="controls">
        <!-- Camera Controls -->
        <div class="control-group">
            <h3>📷 Điều khiển Camera</h3>
            <div class="control-row">
                <button id="autoRotate">🔄 Tự động xoay</button>
                <button id="resetView">🎯 Reset view</button>
                <button id="changeRing">💍 Đổi nhẫn</button>
            </div>
        </div>

        <!-- Gem Colors -->
        <div class="control-group">
            <h3>💎 Màu kim cương</h3>
            <div class="control-row">
                <div class="gem-color" data-color="#ffffff" style="background: white;"></div>
                <div class="gem-color" data-color="#ffb6c1" style="background: #ffb6c1;"></div>
                <div class="gem-color" data-color="#87ceeb" style="background: #87ceeb;"></div>
                <div class="gem-color" data-color="#98fb98" style="background: #98fb98;"></div>
                <div class="gem-color" data-color="#f0e68c" style="background: #f0e68c;"></div>
                <div class="gem-color" data-color="#dda0dd" style="background: #dda0dd;"></div>
            </div>
        </div>

        <!-- Material Colors -->
        <div class="control-group">
            <h3>🥇 Chất liệu</h3>
            <div class="control-row">
                <button class="material-btn" data-material="default">Mặc định</button>
                <button class="material-btn" data-material="gold">Vàng</button>
                <button class="material-btn" data-material="silver">Bạc</button>
                <button class="material-btn" data-material="rose">Vàng hồng</button>
            </div>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <strong>💡 Hướng dẫn:</strong><br>
        • Kéo chuột để xoay nhẫn<br>
        • Cuộn chuột để zoom<br>
        • Sử dụng các nút để thay đổi màu sắc<br>
        • WebGL Ring Viewer với WebGi engine
    </div>

    <!-- WebGi Script (local) -->
    <script type="module" src="./simple-ring.js"></script>
</body>
</html>
