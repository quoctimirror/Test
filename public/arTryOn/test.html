<!DOCTYPE html> <!-- Khai báo loại tài liệu HTML5 -->
<html> <!-- Thẻ gốc của tài liệu HTML -->

<head> <!-- Phần đầu trang chứa metadata và các tài nguyên -->
    <title>iJewel Try-On Demo</title> <!-- Tiêu đề trang web hiển thị trên tab trình duyệt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cấu hình viewport cho responsive trên mobile -->
    <script type="module"> <!-- Khối script dạng module để import thư viện -->
        import { MeshoptDecoder } from 'https://unpkg.com/meshoptimizer@0.20.0/meshopt_decoder.module.js';
        window.MeshoptDecoder = MeshoptDecoder
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #webgi-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        button {
            width: 100px;
            height: 30px;
            cursor: pointer;
        }

        #start-tryon {
            position: fixed;
            top: 0.5rem;
            right: 0.5rem;
        }

        #tryon-options {
            display: none;
            position: fixed;
            bottom: 12px;
            right: 2%;
            gap: 10px;
        }
    </style>
</head>

<body> <!-- Phần thân trang web -->
    <div id="canvas-container"> <!-- Container chứa canvas 3D -->
        <canvas id="webgi-canvas"></canvas> <!-- Canvas element để render 3D scene -->
    </div>

    <button id="start-tryon">Start Try-On</button> <!-- Nút bắt đầu/dừng chế độ thử nhẫn -->

    <div id="tryon-options"> <!-- Container chứa các nút điều khiển -->
        <button id="flip-camera">Flip Camera</button> <!-- Nút đảo ngược camera trước/sau -->
        <button id="switch-finger">Switch Finger</button> <!-- Nút chuyển đổi ngón tay (từ 0-4) -->
        <button id="save-image">Save Image</button> <!-- Nút lưu ảnh chụp màn hình -->
    </div>

    <script src="https://releases.ijewel3d.com/webgi/runtime/bundle-0.15.2.js"></script>
    <!-- Load thư viện WebGI runtime để render 3D -->
    <script>window.webgi = window;</script> <!-- Gán webgi vào window object -->
    <script src="https://releases.ijewel3d.com/libs/web-vto/0.0.35/web-vto-instore.js"></script>
    <!-- Load thư viện Virtual Try-On của iJewel -->

    <script> <!-- Bắt đầu khối script chính -->
        async function init() {
            // Tạo instance ViewerApp để quản lý 3D viewer, truyền canvas element vào
            const viewer = new ViewerApp({
                canvas: document.getElementById("webgi-canvas")
            });

            // Tăng độ phân giải canvas lên 1.5 lần để hiển thị sắc nét hơn
            viewer.renderer.displayCanvasScaling = 1.5;

            // Thêm các plugins cơ bản cần thiết cho viewer
            await addBasePlugins(viewer);

            // Thêm plugin Diamond để render kim cương
            const diamondPlugin = await viewer.addPlugin(DiamondPlugin);
            diamondPlugin.setKey("LICENSE_KEY_FOR_IJEWEL_SDK"); // Thiết lập license key cho iJewel SDK

            // Thêm plugin Ring Try-On để thử nhẫn AR
            const tryon = await viewer.addPlugin(ij_vto.RingTryonPlugin);
            tryon.setKey("LICENSE_KEY_FOR_TRYON_SDK"); // Thiết lập license key cho Try-On SDK

            // Thêm plugin UI cho chức năng Try-On
            await viewer.addPlugin(ij_vto.RingTryonUIPlugin);

            // Tắt rendering trong lúc load để tăng hiệu suất
            viewer.renderEnabled = false;

            // Load model 3D nhẫn từ server
            await viewer.load("https://playground.ijewel3d.com/assets/demo/tryon/demo_tryon.glb");

            // Load file config cho scene và model
            await viewer.load("https://demo.ijewel3d.com/web-vto/tryon-2-web.json");

            // Bật lại rendering sau khi load xong
            viewer.renderEnabled = true;

            // Lấy các elements từ DOM
            const tryonOptions = document.querySelector("#tryon-options");
            const startBtn = document.querySelector("#start-tryon");

            // Gắn sự kiện click cho nút Start/Stop
            startBtn.onclick = async () => {
                // Nếu đang chạy thì dừng, ngược lại thì bắt đầu
                tryon.running ? await tryon.stop() : await tryon.start();

                // Hiện/ẩn các nút tùy chọn
                tryonOptions.style.display = tryon.running ? "flex" : "none";

                // Đổi text nút
                startBtn.innerHTML = tryon.running ? "Stop Try-On" : "Start Try-On";
            };

            // Nút đảo camera: chỉ hoạt động khi tryon đang chạy
            document.querySelector("#flip-camera").onclick = () => tryon.running && tryon.flipCamera();

            // Nút đổi ngón tay: chuyển sang ngón tiếp theo (0-4 rồi quay lại 0)
            document.querySelector("#switch-finger").onclick = () => tryon.running && (tryon.finger = (tryon.finger + 1) % 5);

            // Nút lưu ảnh: chỉ hoạt động khi tryon đang chạy
            document.querySelector("#save-image").onclick = () => tryon.running && tryon.saveImage();
        }

        // Gọi hàm khởi tạo khi trang load xong
        init();
    </script>
</body>

</html>
