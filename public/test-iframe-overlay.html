<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iJewel Viewer - Auto Load</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1a;
      position: relative;
    }

    #iframe-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.loaded {
      display: block;
    }

    /* Custom overlay - User clicks here instead */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-button-custom {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .play-button-custom:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
      border-color: #fff;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-left: 25px solid rgba(255, 255, 255, 0.9);
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      margin-left: 5px;
    }

    .loading-text {
      position: absolute;
      bottom: 40%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="iframe-container">
    <iframe
      id="ijewel-iframe"
      title="demo_tryon.glb"
      frameborder="0"
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
      xr-spatial-tracking
      execution-while-out-of-viewport
      execution-while-not-rendered
      web-share
      allow="camera; autoplay; fullscreen; xr-spatial-tracking; web-share"
      src="">
    </iframe>

    <div id="overlay">
      <div class="play-button-custom">
        <div class="play-icon"></div>
      </div>
      <div class="loading-text">Click to view model</div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const iframe = document.getElementById('ijewel-iframe');

    overlay.addEventListener('click', () => {
      // Hide overlay
      overlay.classList.add('hidden');

      // Load iframe
      iframe.src = 'https://drive.ijewel3d.com/drive/files/RUsrBi-vQey2vExitZOYig/embedded?slug=RUsrBi-vQey2vExitZOYig&autoplay=true&isAutoplay=true&isRemovePlayButton=true&isRemoveHologram=true&isRemoveLogo=true&isRemoveLogoLink=true&isConfigurator=false&isEnabledZoom=true&isShare=false&isResetView=false&isRotateCamera=true&isPlayCameraViews=false&isPlayAnimations=false&isFullScreen=false';
      iframe.classList.add('loaded');

      // Try to auto-click play button after iframe loads
      setTimeout(() => {
        try {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          const playButton = iframeDoc.querySelector('button, [role="button"]');
          if (playButton) {
            playButton.click();
            console.log('Auto-clicked play button in iframe');
          }
        } catch (e) {
          console.log('Cannot auto-click due to CORS restrictions');
        }
      }, 2000);

      // Remove overlay completely after animation
      setTimeout(() => {
        overlay.remove();
      }, 500);
    });
  </script>
</body>
</html>
