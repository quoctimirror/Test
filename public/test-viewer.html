<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iJewel Viewer Test - loadModelById</title>
</head>
<body>
  <div id="root" style="width: 100vw; height: 100vh"></div>
</body>

<script src="https://releases.ijewel3d.com/libs/mini-viewer/0.3.20/bundle.iife.js"></script>

<script>
  const driveBasename = 'drive';
  const modelFileId = 'RUsrBi-vQey2vExitZOYig';
  const containerElement = document.getElementById('root');

  ijewelViewer.loadModelById(
    modelFileId,
    driveBasename,
    containerElement,
    {
      showCard: false,
      showLogo: true,
    }
  );

  window.addEventListener("ijewel-viewer-ready", async (ev) => {
    console.log("Viewer is ready:", ev.detail.viewer);
    const viewer = ev.detail.viewer;
  });
</script>
</html>
