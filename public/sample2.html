<html>

<head>
    <title>iJewel Try-On Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #start-tryon,
        /* #enter-setup-mode, */
        #flip-camera,
        #switch-finger,
        #save-image {
            width: 100px;
            height: 30px;
            cursor: pointer;
        }

        #tryon-options {
            display: none;
            position: fixed;
            bottom: 12px;
            right: 2%;
        }

        #start-tryon {
            position: fixed;
            top: 0.5rem;
            right: 0.5rem;
            height: 30px;
        }

        /* #enter-setup-mode {
            position: fixed;
            top: 12px;
            left: 12px;
        } */

        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
        }

        #fps-counter {
            position: fixed;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            z-index: 10001;
            display: none;
        }
    </style>
    <script type="module">
        import { MeshoptDecoder } from 'https://unpkg.com/meshoptimizer@0.20.0/meshopt_decoder.module.js';
        window.MeshoptDecoder = MeshoptDecoder
    </script>

    <script>
        // FPS Counter
        const fpsCounter = document.getElementById('fps-counter');
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let rafId = null;
        let isTryonRunning = false;

        function updateFps() {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                const fps = frameCount;
                frameCount = 0;
                lastFpsTime = now;

                let color = '#4ade80'; // green >= 50
                if (fps < 30) color = '#ef4444'; // red
                else if (fps < 50) color = '#fbbf24'; // yellow

                fpsCounter.style.color = color;
                fpsCounter.textContent = `${fps} FPS`;
            }
        }

        function fpsLoop() {
            if (!isTryonRunning) return;
            updateFps();
            rafId = requestAnimationFrame(fpsLoop);
        }

        function startFpsCounter() {
            isTryonRunning = true;
            frameCount = 0;
            lastFpsTime = performance.now();
            fpsCounter.style.display = 'block';
            rafId = requestAnimationFrame(fpsLoop);
        }

        function stopFpsCounter() {
            isTryonRunning = false;
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            fpsCounter.style.display = 'none';
        }

        async function init() {
            // Initialize the viewer
            const viewer = new ViewerApp({
                canvas: document.getElementById("webgi-canvas")
            });

            // Set the canvas scaling to 1.5 for sharper rendering
            viewer.renderer.displayCanvasScaling = 1.5;

            // Add and setup all necessary plugins
            await addBasePlugins(viewer);
            const diamondPlugin = await viewer.addPlugin(DiamondPlugin);
            diamondPlugin.setKey("LICENSE_KEY_FOR_IJEWEL_SDK");

            // Add the Ring Try-On Plugin
            const tryon = await viewer.addPlugin(ij_vto.RingTryonPlugin);
            tryon.setKey("LICENSE_KEY_FOR_TRYON_SDK");

            // Add the Ring Try-On UI Plugin
            await viewer.addPlugin(ij_vto.RingTryonUIPlugin);

            const url = new URL(window.location);
            let params = new URLSearchParams(url.search);

            if (params.get("edit") !== null) {
                const uiPlugin = await viewer.addPlugin(TweakpaneUiPlugin);
                uiPlugin.setupPlugins(ij_vto.RingTryonPlugin);
            }

            viewer.renderEnabled = false
            // Load the ring model and config that includes scene settings and model settings
            await viewer.load("https://playground.ijewel3d.com/assets/demo/tryon/demo_tryon.glb");
            await viewer.load("https://playground.ijewel3d.com/assets/demo/tryon/demo_tryon.json");

            // Load an optional scene configuration
            // await viewer.load("https://demo.ijewel3d.com/web-vto/tryon-2-web.json");

            document.querySelector("#loading-text").remove();
            viewer.renderEnabled = true
            const tryonOptions = document.querySelector("#tryon-options");

            // Start or stop the tryon when the button is clicked
            const startBtn = document.querySelector("#start-tryon");
            startBtn.style.display = "initial";
            startBtn.onclick = async () => {
                tryon.running ? await tryon.stop() : await tryon.start();

                if (tryon.running) {
                    tryonOptions.style.display = "initial";
                    startFpsCounter(); // Start FPS counter
                    // enterSetupModeBtn.style.display = "none";
                } else {
                    // enterSetupModeBtn.style.display = "initial";
                    tryonOptions.style.display = "none";
                    stopFpsCounter(); // Stop FPS counter
                }

                startBtn.innerHTML = tryon.running ? "Stop Try-On" : "Start Try-On";
            };

            // const enterSetupModeBtn = document.querySelector("#enter-setup-mode");
            // enterSetupModeBtn.onclick = () => {
            //     if (tryon.inSetupMode) {
            //         tryon.exitSetupMode();
            //         enterSetupModeBtn.textContent = "Enter Setup Mode";
            //         startBtn.style.display = "initial";
            //     } else {
            //         tryon.enterSetupMode();
            //         enterSetupModeBtn.textContent = "Exit Setup Mode";
            //         startBtn.style.display = "none";
            //     }
            // }

            const flipCameraBtn = document.querySelector("#flip-camera");
            flipCameraBtn.style.display = "initial";
            flipCameraBtn.onclick = () => tryon.running && tryon.flipCamera();

            const switchFingerBtn = document.querySelector("#switch-finger");
            switchFingerBtn.style.display = "initial";
            switchFingerBtn.onclick = () => tryon.running && (tryon.finger = (tryon.finger + 1) % 5);

            const saveImageBtn = document.querySelector("#save-image");
            saveImageBtn.style.display = "initial";
            saveImageBtn.onclick = () => tryon.running && tryon.saveImage();
        }

        init();
    </script>
