<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Viewer with Hand Detection (Official Method)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #viewer-container {
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        button {
            font-size: 20px;
        }

        #flip-btn {
            display: none;
        }

        #debug-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 1001;
            display: none;
        }

        #fps-counter {
            position: absolute;
            top: 70px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #4ade80;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            z-index: 1001;
            display: none;
        }
    </style>
</head>

<body>
    <div id="viewer-container"></div>
    <div id="controls">
        <button id="ar-btn">Start AR</button>
        <button id="flip-btn">Flip Camera</button>
    </div>

    <div id="debug-panel">
        <p>Hand Detection:</p>
        <pre id="hand-result">Initializing...</pre>
    </div>

    <div id="fps-counter">0 FPS</div>

    <!-- Thư viện của ijewel3d -->
    <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.18.0.js"></script>
    <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.5.0/bundle.nowebgi.iife.js"></script>
    <script>window.webgi = window;</script>
    <script src="https://releases.ijewel3d.com/libs/web-vto/0.0.37/web-vto.js"></script>

    <!-- Thư viện MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script type="module">
        const { loadModelById } = window.ijewelViewer;
        const fileId = 'NhxeWOUnQdOZPoQKTeD0Eg';
        const basename = 'drive';

        const container = document.getElementById('viewer-container');
        const arBtn = document.getElementById('ar-btn');
        const flipBtn = document.getElementById('flip-btn');
        const debugPanel = document.getElementById('debug-panel');
        const handResultEl = document.getElementById('hand-result');
        const fpsCounter = document.getElementById('fps-counter');

        let viewerApp;
        let arPlugin;
        let inAR = false;
        let fileConfig;
        let hands;
        let animationFrameId;

        // FPS tracking
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let currentFps = 0;

        async function initViewer() {
            window.addEventListener('ijewel-file-data', (event) => {
                const fileData = event.detail.iJewelFileData?.config;
                fileConfig = JSON.parse(fileData);
            });
            await loadModelById(fileId, basename, container, { showUiButtons: false, hideTryOn: true });
            window.addEventListener('ijewel-viewer-ready', (event) => {
                viewerApp = event.detail.viewer;
                console.log('Viewer ready');
            });
        }

        function onResults(results) {
            if (results.multiHandedness && results.multiHandedness.length > 0) {
                const hand = results.multiHandedness[0];
                handResultEl.textContent = `Hand: ${hand.label}\nConfidence: ${(hand.score * 100).toFixed(2)}%`;
            } else {
                handResultEl.textContent = 'No hand detected';
            }
        }

        function setupMediaPipe() {
            hands = new window.Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults(onResults);
        }

        function updateFps() {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsTime = now;

                // Update color based on FPS
                let color = '#4ade80'; // green
                if (currentFps < 30) color = '#ef4444'; // red
                else if (currentFps < 50) color = '#fbbf24'; // yellow

                fpsCounter.style.color = color;
                fpsCounter.textContent = `${currentFps} FPS`;
            }
        }

        function startMediaPipeLoop(videoElement) {
            const processVideo = async () => {
                if (!inAR) return;

                // Update FPS
                updateFps();

                // Gửi frame tới MediaPipe để xử lý
                await hands.send({ image: videoElement });
                // Lặp lại cho frame tiếp theo
                animationFrameId = requestAnimationFrame(processVideo);
            };
            processVideo();
        }

        async function startAR() {
            if (!window.ij_vto) throw new Error('WebVTO is not loaded');

            arPlugin = await viewerApp.addPlugin(ij_vto.RingTryonPlugin);

            // ===== THAY ĐỔI CỐT LÕI: Lắng nghe sự kiện chính thức từ plugin =====
            // Plugin sẽ phát ra sự kiện 'AR_STARTED' khi camera đã sẵn sàng.
            // Payload của sự kiện chứa phần tử video.
            arPlugin.addEventListener('AR_STARTED', (event) => {
                console.log("Event 'AR_STARTED' received!", event);
                const videoElement = event.videoEl; // Lấy video element từ payload của sự kiện

                if (videoElement) {
                    console.log("Video element successfully obtained from event.", videoElement);
                    // Bây giờ video đã chắc chắn sẵn sàng, bắt đầu vòng lặp MediaPipe
                    startMediaPipeLoop(videoElement);
                } else {
                    console.error("AR_STARTED event did not contain a video element.");
                    handResultEl.textContent = "Error: AR event payload is invalid.";
                }
            });
            // =================================================================

            if (fileConfig?.tryonConfig) {
                fileConfig.tryonConfig.type = 'RingTryonPlugin';
                arPlugin.fromJSON(fileConfig.tryonConfig);
            }

            // Lệnh start() bây giờ chỉ có nhiệm vụ khởi động quá trình.
            // Việc lấy video element sẽ do event listener ở trên xử lý.
            await arPlugin.start();
        }

        async function stopAR() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (arPlugin) await arPlugin.stop();
            inAR = false;
            arBtn.textContent = 'Start AR';
            flipBtn.style.display = 'none';
            debugPanel.style.display = 'none';
            fpsCounter.style.display = 'none';
            // Reset FPS tracking
            frameCount = 0;
            currentFps = 0;
        }

        arBtn.addEventListener('click', async () => {
            arBtn.disabled = true;
            arBtn.textContent = 'Loading...';

            if (inAR) {
                await stopAR();
                arBtn.disabled = false;
                return;
            }

            try {
                if (!hands) setupMediaPipe();
                await startAR();
                inAR = true;
                arBtn.textContent = 'Exit AR';
                flipBtn.style.display = 'block';
                debugPanel.style.display = 'block';
                fpsCounter.style.display = 'block';
            } catch (error) {
                console.error('AR error:', error);
                arBtn.textContent = 'Start AR';
                handResultEl.textContent = `Error:\n${error.message}`;
                debugPanel.style.display = 'block';
                await stopAR();
            } finally {
                arBtn.disabled = false;
            }
        });

        flipBtn.addEventListener('click', async () => {
            if (!arPlugin || !inAR) return;
            flipBtn.disabled = true;
            try { await arPlugin.flipCamera(); }
            catch (error) { console.error('Flip camera error:', error); }
            finally { flipBtn.disabled = false; }
        });

        initViewer();
    </script>
</body>

</html>
