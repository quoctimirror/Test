<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Viewer Example</title>
    <style>
        /* Reset margin/padding cho toàn trang */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Container chứa viewer 3D - chiếm toàn màn hình */
        #viewer-container {
            width: 100vw;   /* 100% viewport width */
            height: 100vh;  /* 100% viewport height */
        }

        /* Khung chứa các nút điều khiển - đặt ở trên cùng giữa màn hình */
        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);  /* Center theo chiều ngang */
            display: flex;
            gap: 10px;  /* Khoảng cách giữa các nút */
            z-index: 1000;  /* Hiển thị trên cùng */
        }

        /* Style cho tất cả các button */
        button {
            font-size: 20px;
        }

        /* Ẩn nút Flip khi chưa vào AR */
        #flip-btn {
            display: none;
        }


        /* Debug Info Panel */
        #debug-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            display: none;  /* Ẩn khi chưa vào AR */
            z-index: 1000;
            min-width: 250px;
        }

        /* Responsive cho Mobile */
        @media (max-width: 768px) {
            #debug-info {
                top: auto;
                bottom: 20px;  /* Thấp hơn, gần bottom của màn hình */
                left: 10px;
                right: 10px;
                min-width: auto;
                max-width: calc(100vw - 20px);
                padding: 10px;
                font-size: 11px;
            }

            #debug-info h3 {
                font-size: 13px;
                margin-bottom: 8px;
            }

            .debug-item {
                grid-template-columns: 80px 1fr;
                gap: 5px;
                margin: 5px 0;
                padding: 4px;
                font-size: 10px;
            }

            .debug-label {
                font-size: 10px;
            }

            .debug-value {
                font-size: 11px;
            }
        }

        #debug-info h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
        }

        .debug-item {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 10px;
            margin: 8px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            align-items: center;
        }

        .debug-label {
            color: #aaa;
            font-weight: bold;
            font-size: 12px;
        }

        .debug-value {
            color: #0f0;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>

<body>
    <!-- Container chính để hiển thị model 3D và AR -->
    <div id="viewer-container"></div>

    <!-- Các nút điều khiển -->
    <div id="controls">
        <button id="ar-btn">Start AR</button>
        <button id="flip-btn">Flip Camera</button>
    </div>

    <!-- Debug Info Panel -->
    <div id="debug-info">
        <h3>🔍 DEBUG INFO</h3>
        <div class="debug-item">
            <span class="debug-label">Device:</span>
            <span class="debug-value" id="debug-device">Unknown</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">Camera:</span>
            <span class="debug-value" id="debug-camera">Back</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">Hand:</span>
            <span class="debug-value" id="debug-hand">Not detected</span>
        </div>
    </div>

    <!-- Load thư viện WebGI - Engine 3D của iJewel -->
    <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.18.0.js"> </script>

    <!-- Load thư viện Mini Viewer - SDK để hiển thị model 3D -->
    <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.5.0/bundle.nowebgi.iife.js"></script>

    <!-- Thiết lập window.webgi cho ij_vto hoạt động -->
    <script>window.webgi = window;</script>

    <!-- Load thư viện Web VTO - Virtual Try-On (AR thử nhẫn) -->
    <script src="https://releases.ijewel3d.com/libs/web-vto/0.0.37/web-vto.js"> </script>

    <!-- Load MediaPipe Hands để phát hiện bàn tay trái/phải -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // Lấy hàm loadModelById từ SDK iJewel để load model 3D
        const { loadModelById } = window.ijewelViewer;

        // ID của file model nhẫn trên server
        const fileId = 'HB3RidmJSdezIO1T2hdXcQ';
        const basename = 'drive';

        // Lấy các element HTML để tương tác
        const container = document.getElementById('viewer-container');
        const arBtn = document.getElementById('ar-btn');
        const flipBtn = document.getElementById('flip-btn');

        // Debug info elements
        const debugInfo = document.getElementById('debug-info');
        const debugDevice = document.getElementById('debug-device');
        const debugCamera = document.getElementById('debug-camera');
        const debugHand = document.getElementById('debug-hand');

        // Khai báo các biến toàn cục
        let viewerInstance;  // Instance của viewer
        let viewerApp;       // App viewer chính
        let arPlugin;        // Plugin AR để thử nhẫn
        let inAR = false;    // Trạng thái có đang trong chế độ AR không
        let fileConfig;      // Config của file từ server
        let currentFinger = 0;  // Ngón tay hiện tại (0-4)
        let currentCamera = 0;  // Camera hiện tại: 0 = front (default), 1 = back
        let currentHand = -1;   // Tay được detect: -1 = chưa detect, 0 = trái, 1 = phải
        let deviceType = 'Unknown';  // Loại thiết bị
        let mediaPipeHands = null;   // Instance MediaPipe để detect tay
        let debugUpdateInterval = null;  // Interval để update debug info định kỳ

        // Mảng tên các ngón tay (theo mapping của SDK)
        // SDK mapping: 0=Thumb, 1=Index, 2=Middle, 3=Ring, 4=Pinky
        const fingerNames = ['Ngón cái', 'Ngón trỏ', 'Ngón giữa', 'Ngón áp út', 'Ngón út'];

        // Phát hiện loại thiết bị (Mobile hay Desktop)
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        deviceType = isMobile ? 'Mobile' : 'Desktop';
        console.log('📱 Device type:', deviceType);
        console.log('📷 Default camera: Front Camera (index 0) for both Mobile and Desktop');

        // Hàm cập nhật debug info panel
        function updateDebugInfo() {
            // Update Device
            debugDevice.textContent = deviceType === 'Mobile' ? '📱 Mobile' : '💻 Desktop';

            // Update Camera
            let cameraName = '';
            if (currentCamera === 0) {
                cameraName = '🤳 Front Camera (0)';
            } else {
                cameraName = '📷 Back Camera (1)';
            }
            debugCamera.textContent = cameraName;

            // Update Hand
            let handName = '❌ Not detected';
            if (currentHand === 0) handName = '🖐️ Left Hand';
            else if (currentHand === 1) handName = '🖐️ Right Hand';
            debugHand.textContent = handName;
        }

        // Biến để lưu video/canvas element tìm được
        let detectedSourceElement = null;

        // MutationObserver để track khi AR plugin tạo video/canvas element mới
        function startElementObserver() {
            console.log('👁️ Starting MutationObserver to detect video/canvas elements...');

            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.tagName === 'VIDEO' || node.tagName === 'CANVAS') {
                            console.log('🎯 NEW ELEMENT DETECTED:', node.tagName, node);
                            if (node.tagName === 'VIDEO') {
                                detectedSourceElement = node;
                                console.log('✅ Video element captured for MediaPipe');
                            } else if (node.tagName === 'CANVAS' && !detectedSourceElement) {
                                detectedSourceElement = node;
                                console.log('✅ Canvas element captured for MediaPipe');
                            }
                        }
                    });
                });
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

            console.log('✅ MutationObserver started');
        }

        // Khởi tạo MediaPipe Hands để phát hiện tay trái/phải
        async function initMediaPipeHands() {
            // Kiểm tra thư viện MediaPipe đã load chưa
            console.log('🔍 Checking MediaPipe library... window.Hands:', typeof window.Hands);

            if (!window.Hands) {
                console.error('❌ MediaPipe Hands library NOT LOADED! Check CDN link.');
                return;
            }

            try {
                console.log('🤚 Initializing MediaPipe Hands...');
                console.log('✅ MediaPipe Hands library is available!');

                // Khởi tạo MediaPipe Hands
                const hands = new window.Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                // Cấu hình MediaPipe - SỬ DỤNG SETTINGS GIỐNG JSX (ĐANG HOẠT ĐỘNG)
                hands.setOptions({
                    maxNumHands: 1,              // Chỉ detect 1 bàn tay
                    modelComplexity: 1,          // Model complexity 1 (cân bằng giữa tốc độ và độ chính xác)
                    minDetectionConfidence: 0.5, // Confidence 0.5 (giống JSX)
                    minTrackingConfidence: 0.5   // Tracking 0.5 (giống JSX)
                });
                console.log('⚙️ MediaPipe config: modelComplexity=1, confidence=0.5');

                // Callback khi MediaPipe detect được tay
                let callbackCount = 0;
                hands.onResults((results) => {
                    callbackCount++;

                    // Log lần đầu tiên callback được gọi
                    if (callbackCount === 1) {
                        console.log('🎯 MediaPipe onResults callback is working!');
                        console.log('   First result:', results);
                    }

                    // Log mỗi 60 frames để theo dõi
                    if (callbackCount % 60 === 0) {
                        console.log(`📊 Callback called ${callbackCount} times. Hands detected:`, results.multiHandedness?.length || 0);
                    }

                    if (results.multiHandedness && results.multiHandedness.length > 0) {
                        // Lấy label tay: "Left" hoặc "Right"
                        const handLabel = results.multiHandedness[0].label;

                        // DEBUG: Log RAW MediaPipe output
                        if (callbackCount % 30 === 0) {
                            console.log('🔍 === MEDIAPIPE RAW OUTPUT ===');
                            console.log('   MediaPipe handLabel:', handLabel);
                            console.log('   currentCamera:', currentCamera);
                            console.log('   Confidence:', results.multiHandedness[0].score.toFixed(2));
                        }

                        // QUAN TRỌNG: ĐẢO NGƯỢC KẾT QUẢ vì camera mirror effect
                        // Front camera (currentCamera = 0 hoặc facingMode = 'user'):
                        //   - MediaPipe trả "Left" → thực tế là tay PHẢI (vì bị mirror)
                        //   - MediaPipe trả "Right" → thực tế là tay TRÁI
                        // Nên cần đảo ngược: Left → 1 (phải), Right → 0 (trái)

                        const isFrontCamera = (currentCamera === 0);
                        let handIndex;

                        if (isFrontCamera) {
                            // Front camera: ĐẢO NGƯỢC
                            handIndex = handLabel === 'Left' ? 1 : 0;
                        } else {
                            // Back camera: GIỮ NGUYÊN
                            handIndex = handLabel === 'Left' ? 0 : 1;
                        }

                        // Nếu tay thay đổi
                        if (currentHand !== handIndex) {
                            currentHand = handIndex;
                            const realHandName = handIndex === 0 ? 'Tay trái' : 'Tay phải';
                            console.log('✋ HAND DETECTED CHANGE:');
                            console.log('   MediaPipe label:', handLabel);
                            console.log('   Camera:', isFrontCamera ? 'Front (0)' : 'Back (1)', '| currentCamera =', currentCamera);
                            console.log('   handIndex:', handIndex);
                            console.log('   Result:', realHandName);
                            console.log('   Confidence:', results.multiHandedness[0].score.toFixed(2));
                        }
                    } else {
                        // Không detect được tay nào
                        if (currentHand !== -1) {
                            currentHand = -1;
                            console.log('❌ Hand lost (no hands in frame)');
                        }
                    }
                });

                // Khởi tạo MediaPipe
                await hands.initialize();
                mediaPipeHands = hands;
                console.log('✅ MediaPipe Hands initialized');

                // Hàm detect liên tục từ CANVAS (giống JSX)
                let logCount = 0;
                let waitCount = 0;
                const detect = async () => {
                    // CHỈ detect khi inAR = true VÀ mediaPipeHands ready
                    if (inAR && mediaPipeHands) {
                        try {
                            // Ưu tiên dùng element đã detect từ MutationObserver
                            let sourceElement = detectedSourceElement;

                            // Nếu chưa có, tìm thủ công
                            if (!sourceElement) {
                                // Tìm tất cả video và canvas
                                const allVideos = document.querySelectorAll('video');
                                const allCanvases = document.querySelectorAll('canvas');

                                // Ưu tiên VIDEO
                                for (const v of allVideos) {
                                    if (v.videoWidth > 0 && v.videoHeight > 0 && v.readyState >= 2) {
                                        sourceElement = v;
                                        detectedSourceElement = v;
                                        break;
                                    }
                                }

                                // Nếu không có video, dùng CANVAS
                                if (!sourceElement) {
                                    for (const c of allCanvases) {
                                        if (c.width > 0 && c.height > 0) {
                                            sourceElement = c;
                                            detectedSourceElement = c;
                                            break;
                                        }
                                    }
                                }

                                // Log info lần đầu hoặc mỗi 60 frames khi đang tìm
                                if (logCount === 0 || (waitCount > 0 && waitCount % 60 === 0)) {
                                    console.log('🔍 === CHECKING ELEMENTS ===');
                                    console.log('   All videos:', allVideos.length);
                                    console.log('   All canvases:', allCanvases.length);
                                    if (allVideos.length > 0) {
                                        allVideos.forEach((v, i) => {
                                            console.log(`   Video[${i}]:`, v.videoWidth + 'x' + v.videoHeight, 'readyState:', v.readyState);
                                        });
                                    }
                                    if (allCanvases.length > 0) {
                                        allCanvases.forEach((c, i) => {
                                            console.log(`   Canvas[${i}]:`, c.width + 'x' + c.height, c.id || '(no id)');
                                        });
                                    }
                                    console.log('   Selected element:', sourceElement?.tagName, sourceElement);
                                }
                            }

                            // CHỈ send frame nếu có sourceElement VÀ ready
                            if (sourceElement) {
                                let canSend = false;

                                // Check nếu là VIDEO - phải có kích thước
                                if (sourceElement.tagName === 'VIDEO') {
                                    if (sourceElement.videoWidth > 0 && sourceElement.videoHeight > 0) {
                                        canSend = true;
                                        waitCount = 0; // Reset wait counter
                                    } else {
                                        waitCount++;
                                        if (waitCount === 1) {
                                            console.warn('⚠️ Video not ready yet (width/height = 0), waiting...');
                                        }
                                    }
                                } else {
                                    // CANVAS - send luôn
                                    canSend = true;
                                    waitCount = 0;
                                }

                                // Gửi frame tới MediaPipe
                                if (canSend) {
                                    await mediaPipeHands.send({ image: sourceElement });

                                    if (logCount === 0) {
                                        console.log('✅ First frame sent to MediaPipe from:', sourceElement.tagName);
                                        console.log('✅ Using element for MediaPipe:', sourceElement);
                                    }

                                    if (logCount % 120 === 0 && logCount > 0) {
                                        console.log(`📊 Detection running... frame ${logCount}`);
                                    }

                                    logCount++;
                                }
                            } else {
                                // Không tìm thấy element - log warning và tạo fallback
                                waitCount++;
                                if (waitCount === 1) {
                                    console.warn('⚠️ No video or canvas element found!');
                                    console.warn('⚠️ Attempting to create video element from camera stream...');

                                    // TỰ TẠO VIDEO ELEMENT từ camera (fallback)
                                    try {
                                        const video = document.createElement('video');
                                        video.style.display = 'none';
                                        video.autoplay = true;
                                        video.playsInline = true;
                                        document.body.appendChild(video);

                                        navigator.mediaDevices.getUserMedia({
                                            video: { facingMode: 'user' },
                                            audio: false
                                        }).then(stream => {
                                            video.srcObject = stream;
                                            detectedSourceElement = video;
                                            waitCount = 0;
                                            console.log('✅ Created video element from camera stream');
                                        }).catch(err => {
                                            console.error('❌ Failed to access camera:', err);
                                        });
                                    } catch (err) {
                                        console.error('❌ Failed to create video element:', err);
                                    }
                                }
                            }
                        } catch (err) {
                            console.error('❌ MediaPipe detect error:', err);
                        }
                    }

                    // LUÔN LUÔN schedule frame tiếp theo (nếu vẫn còn trong AR)
                    if (inAR) {
                        requestAnimationFrame(detect);
                    }
                };

                // Bắt đầu detection loop ngay lập tức (giống JSX)
                console.log('🚀 Starting MediaPipe hand detection loop...');
                detect();

            } catch (err) {
                console.error('❌ MediaPipe Hands init error:', err);
            }
        }

        // Khởi tạo viewer để hiển thị model 3D
        async function initViewer() {

            // Lắng nghe event khi data từ server trả về
            window.addEventListener('ijewel-file-data', (event) => {
                // Lấy config từ event (chứa settings của model)
                const fileData = event.detail.iJewelFileData?.config;
                fileConfig = JSON.parse(fileData)
            });

            // Load model bằng ID từ server iJewel
            await loadModelById(fileId, basename, container, {
                showUiButtons: false,  // Ẩn các nút UI mặc định
                hideTryOn: true        // Ẩn nút Try On mặc định
            });

            // Lắng nghe event khi viewer đã sẵn sàng
            window.addEventListener('ijewel-viewer-ready', async (event) => {
                viewerApp = event.detail.viewer;  // Lưu instance viewer
                console.log('Viewer ready');
            });

        }

        // Bắt đầu chế độ AR
        async function startAR() {
            // Kiểm tra thư viện WebVTO đã load chưa
            if (!window.ij_vto) {
                console.error('WebVTO is not loaded');
                return;
            }

            // Load plugin AR (RingTryonPlugin) vào viewer
            arPlugin = await viewerApp.addPlugin(ij_vto.RingTryonPlugin);

            // Load config mặc định từ file standard_1.json
            try {
                const response = await fetch('/arTryOn/standard_1.json');
                const standard1Config = await response.json();
                console.log('📦 Loaded standard_1.json:', standard1Config);

                // Áp dụng config vào plugin
                if (standard1Config) {
                    // Tỷ lệ scale của model nhẫn
                    if (standard1Config.modelScaleFactor !== undefined) {
                        arPlugin.modelScaleFactor = standard1Config.modelScaleFactor;
                    }
                    // Tỷ lệ scale của occluder (vật che ngón tay)
                    if (standard1Config.occluderScaleFactor !== undefined) {
                        arPlugin.occluderScaleFactor = standard1Config.occluderScaleFactor;
                    }
                    console.log('✅ Applied standard_1.json config');
                }
            } catch (error) {
                console.error('❌ Failed to load standard_1.json:', error);
            }

            // Load config đã lưu từ editor (nếu có) - sẽ override config standard_1
            if (fileConfig?.tryonConfig) {
                fileConfig.tryonConfig.type = 'RingTryonPlugin';
                arPlugin.fromJSON(fileConfig?.tryonConfig);
                console.log('✅ Applied Drive config (override)');
            }

            // CONFIG CAMERA: Mặc định LUÔN LUÔN dùng Front Camera (user) cho cả Mobile và Desktop
            // DEBUG: Log tất cả properties của arPlugin
            console.log('🔍 AR Plugin properties:', Object.keys(arPlugin));

            // Set facingMode = 'user' (Front Camera) TRƯỚC KHI start
            arPlugin.facingMode = 'user';
            console.log('📷 Config: arPlugin.facingMode = user (Front Camera) - Default for both Mobile & Desktop');

            // Khởi động AR plugin (bật camera)
            console.log('🚀 Calling arPlugin.start()...');
            await arPlugin.start();
            console.log('✅ arPlugin.start() completed');

            // DEBUG: Check finger index mapping của SDK
            console.log('🔍 === DEFAULT FINGER CHECK ===');
            console.log('   currentFinger (our code):', currentFinger);
            console.log('   arPlugin.finger (SDK):', arPlugin.finger);
            console.log('   fingerNames[0]:', fingerNames[0], '(Ngón cái / Thumb)');
            console.log('   Expected: Ngón cái should be shown on AR');

            // Start observer NGAY LẬP TỨC (trước khi AR tạo element)
            console.log('👁️ Starting element observer BEFORE MediaPipe init...');
            startElementObserver();

            // ĐỢI 1000MS ĐỂ AR CAMERA/VIDEO ELEMENT SẴN SÀNG
            console.log('📍 Waiting for AR camera to stabilize...');
            setTimeout(() => {
                console.log('📍 Now initializing MediaPipe after AR started...');
                initMediaPipeHands();
            }, 1000);
        }

        // Event listener cho nút "Start AR" / "Exit AR"
        arBtn.addEventListener('click', async () => {

            // Nếu đang ở trong AR -> Thoát AR
            if (inAR) {
                await arPlugin.stop();  // Dừng AR plugin
                inAR = false;
                arBtn.textContent = 'Start AR';
                // Ẩn các nút điều khiển
                flipBtn.style.display = 'none';
                debugInfo.style.display = 'none';

                // Clear interval update debug info
                if (debugUpdateInterval) {
                    clearInterval(debugUpdateInterval);
                    debugUpdateInterval = null;
                }

                // Reset hand detection (KHÔNG close MediaPipe - để reuse cho lần Start AR tiếp theo)
                currentHand = -1;
                console.log('🛑 AR stopped, hand reset to -1');

                return;
            }

            // Nếu chưa vào AR -> Bắt đầu AR
            try {
                await startAR()  // Gọi hàm startAR

                inAR = true;
                arBtn.textContent = 'Exit AR';
                // Hiện các nút điều khiển
                flipBtn.style.display = 'block';
                debugInfo.style.display = 'block';
                updateDebugInfo();  // Cập nhật debug info

                // Bật interval để update debug info liên tục
                debugUpdateInterval = setInterval(() => {
                    updateDebugInfo();
                }, 500);  // Update mỗi 500ms
            } catch (error) {
                console.error('AR error:', error);
                arBtn.textContent = 'Start AR';
            } finally {
                arBtn.disabled = false;
            }
        });

        // Event listener cho nút "Flip Camera" - Đổi camera trước/sau
        flipBtn.addEventListener('click', async () => {
            // Kiểm tra AR plugin đã sẵn sàng và đang trong AR
            if (!arPlugin || !inAR) return;
            flipBtn.disabled = true;  // Disable nút để tránh click nhiều lần
            try {
                console.log('🔄 Flipping camera...');

                // Gọi hàm flip camera của plugin
                await arPlugin.flipCamera();

                // Cập nhật trạng thái camera (0 <-> 1)
                currentCamera = (currentCamera + 1) % 2;
                console.log('📷 Camera flipped to:', currentCamera === 0 ? 'Front Camera (0)' : 'Back Camera (1)');

                // QUAN TRỌNG: Reset detectedSourceElement để detection loop tìm lại element mới
                detectedSourceElement = null;
                console.log('🔄 Reset detectedSourceElement - will search for new video/canvas element');

                // Reset currentHand để detection bắt đầu lại
                currentHand = -1;
                console.log('🔄 Reset currentHand to -1');

                // Đợi 300ms để camera mới sẵn sàng
                await new Promise(resolve => setTimeout(resolve, 300));
                console.log('✅ Camera flip completed, detection loop will find new element');

                // Cập nhật debug info
                updateDebugInfo();
            } catch (error) {
                console.error('Flip camera error:', error);
            } finally {
                flipBtn.disabled = false;  // Enable lại nút
            }
        });

        // Khởi tạo viewer khi trang load
        initViewer();
    </script>
</body>

</html>
