<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDK Inspector</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        #viewer-container {
            width: 100vw;
            height: 50vh;
            background: #000;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px;
        }
        button:hover {
            background: #005a9e;
        }
        .info {
            margin: 20px 0;
            padding: 10px;
            background: #252526;
            border-left: 3px solid #4ec9b0;
        }
        .finger-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #252526;
            border: 2px solid #4ec9b0;
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 280px;
            display: none;
            z-index: 1000;
        }
        .finger-panel.active {
            display: block;
        }
        .camera-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #252526;
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 300px;
            display: none;
            z-index: 1000;
        }
        .camera-panel.active {
            display: block;
        }
        .camera-panel h3 {
            margin: 0 0 15px 0;
            color: #2196F3;
            font-size: 16px;
        }
        .api-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e1e;
            border: 2px solid #9C27B0;
            border-radius: 8px;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }
        .api-panel.active {
            display: block;
        }
        .api-panel h3 {
            margin: 0 0 15px 0;
            color: #9C27B0;
            font-size: 18px;
        }
        .api-summary {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            color: #888;
        }
        .api-summary strong {
            color: #4ec9b0;
        }
        .api-filter {
            margin-bottom: 15px;
        }
        .api-filter input {
            width: 100%;
            padding: 10px;
            background: #252526;
            border: 1px solid #444;
            border-radius: 4px;
            color: #d4d4d4;
            font-size: 14px;
        }
        .api-list {
            max-height: 50vh;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            background: #252526;
            padding: 10px;
            border-radius: 4px;
        }
        .api-item {
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .api-item.camera {
            background: #3d2e00;
            color: #FF9800;
            font-weight: bold;
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
        }
        .api-item .path {
            color: #9cdcfe;
        }
        .api-item .type {
            color: #4ec9b0;
            margin-left: 10px;
        }
        .api-item .value {
            color: #ce9178;
            margin-left: 10px;
        }
        .api-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1999;
            display: none;
        }
        .api-overlay.active {
            display: block;
        }
        .finger-panel h3 {
            margin: 0 0 15px 0;
            color: #4ec9b0;
            font-size: 16px;
        }
        .finger-row {
            margin: 8px 0;
        }
        .finger-label {
            color: #9cdcfe;
        }
        .finger-value {
            color: #ce9178;
            font-weight: bold;
            font-size: 18px;
            margin-left: 10px;
        }
        .finger-result {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0 0 0;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>🔍 iJewel SDK Inspector</h1>
    <p class="info">Mở Console (F12) để xem kết quả chi tiết</p>

    <div id="viewer-container"></div>

    <button id="inspect-btn">1. Inspect SDK Structure</button>
    <button id="ar-btn">2. Start AR & Monitor</button>
    <button id="finger-btn" disabled style="opacity: 0.5">3. Test Finger Order</button>
    <button id="switch-finger-btn" disabled style="opacity: 0.5">Switch Finger</button>
    <button id="camera-btn" disabled style="opacity: 0.5">Test Camera API</button>
    <button id="flip-btn" disabled style="opacity: 0.5">Flip Camera</button>
    <button id="list-api-btn" disabled style="opacity: 0.5">List Camera APIs</button>

    <!-- Finger Info Panel -->
    <div id="finger-panel" class="finger-panel">
        <h3>🖐️ Finger Info</h3>
        <div class="finger-row">
            <span class="finger-label">Index:</span>
            <span id="finger-index" class="finger-value">-</span>
        </div>
        <div class="finger-row">
            <span class="finger-label">getCurrentFinger():</span>
        </div>
        <pre id="finger-result" class="finger-result">-</pre>
    </div>

    <!-- Camera Info Panel -->
    <div id="camera-panel" class="camera-panel">
        <h3>📷 Camera Info (SDK Internal)</h3>
        <div class="finger-row">
            <span class="finger-label">Plugin:</span>
            <span id="plugin-name" class="finger-value">-</span>
        </div>
        <div class="finger-row">
            <span class="finger-label">mediaSettings:</span>
        </div>
        <pre id="media-settings" class="finger-result">-</pre>
        <div class="finger-row">
            <span class="finger-label">facingMode:</span>
            <span id="facing-mode" class="finger-value">-</span>
        </div>
    </div>

    <!-- Overlay for API Panel -->
    <div id="api-overlay" class="api-overlay"></div>

    <!-- Camera APIs Panel -->
    <div id="api-panel" class="api-panel">
        <button id="api-close" style="position:absolute; top:10px; right:10px; background:#f44336; padding:8px 12px; font-size:14px; margin:0;">✕ Close</button>
        <h3>📷 Camera APIs (SDK Internal)</h3>
        <div class="api-summary">
            <span>Found: <strong id="api-camera">0</strong> camera-related</span>
            <span>(Total scanned: <strong id="api-total">0</strong>)</span>
        </div>
        <div class="api-filter">
            <input type="text" id="api-search" placeholder="Search APIs..." />
        </div>
        <div id="api-list" class="api-list"></div>
    </div>

    <script src="https://releases.ijewel3d.com/libs/webgi-v0/bundle-0.18.0.js"></script>
    <script src="https://releases.ijewel3d.com/libs/mini-viewer/0.5.0/bundle.nowebgi.iife.js"></script>
    <script>window.webgi = window;</script>
    <script src="https://releases.ijewel3d.com/libs/web-vto/0.0.37/web-vto.js"></script>

    <script>
        const fileId = 'dY4BIhDDQNmCVTRrEpV2QQ';
        const basename = 'drive';
        const container = document.getElementById('viewer-container');
        const arBtn = document.getElementById('ar-btn');
        const inspectBtn = document.getElementById('inspect-btn');
        const fingerBtn = document.getElementById('finger-btn');
        const switchFingerBtn = document.getElementById('switch-finger-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const flipBtn = document.getElementById('flip-btn');
        const listApiBtn = document.getElementById('list-api-btn');
        const fingerPanel = document.getElementById('finger-panel');
        const fingerIndexEl = document.getElementById('finger-index');
        const fingerResultEl = document.getElementById('finger-result');
        const cameraPanel = document.getElementById('camera-panel');
        const pluginNameEl = document.getElementById('plugin-name');
        const mediaSettingsEl = document.getElementById('media-settings');
        const facingModeEl = document.getElementById('facing-mode');

        // API Panel elements
        const apiPanel = document.getElementById('api-panel');
        const apiOverlay = document.getElementById('api-overlay');
        const apiTotal = document.getElementById('api-total');
        const apiCamera = document.getElementById('api-camera');
        const apiSearch = document.getElementById('api-search');
        const apiList = document.getElementById('api-list');

        // Store all APIs for filtering
        let allAPIsData = [];

        let viewerApp;
        let arPlugin;
        let inAR = false;
        const networkRequests = [];

        // ============================================
        // INTERCEPT NETWORK REQUESTS
        // ============================================
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const url = args[0];
            if (typeof url === 'string') {
                const keywords = ['.wasm', '.tflite', 'mediapipe', 'tfjs', 'hands', 'pose', '.bin', 'model', 'detector', 'tracker'];
                if (keywords.some(k => url.toLowerCase().includes(k))) {
                    networkRequests.push(url);
                    console.log('%c🌐 NETWORK REQUEST:', 'color: orange; font-weight: bold; font-size: 14px', url);
                }
            }
            return originalFetch.apply(this, args);
        };

        // ============================================
        // HELPER: Recursive deep inspection
        // ============================================
        let inspected = new WeakSet(); // Use 'let' so we can recreate it
        const trackingKeywords = ['hand', 'track', 'detect', 'finger', 'media', 'pose', 'tensor', 'model', 'wasm', 'ml'];

        function isTrackingRelated(key) {
            const keyLower = key.toLowerCase();
            return trackingKeywords.some(keyword => keyLower.includes(keyword));
        }

        function recursiveInspect(obj, name, depth = 0, maxDepth = 3) {
            if (depth > maxDepth) return;
            if (!obj || typeof obj !== 'object' && typeof obj !== 'function') return;
            if (inspected.has(obj)) return;

            inspected.add(obj);

            const indent = '  '.repeat(depth);
            const keys = [];

            // Get all keys (own + prototype)
            try {
                keys.push(...Object.getOwnPropertyNames(obj));
                if (obj.constructor && obj.constructor.prototype) {
                    keys.push(...Object.getOwnPropertyNames(obj.constructor.prototype));
                }
            } catch (e) {
                // ignore
            }

            const uniqueKeys = [...new Set(keys)].filter(k => k !== '__proto__' && k !== 'constructor');

            uniqueKeys.forEach(key => {
                try {
                    const value = obj[key];
                    const type = typeof value;
                    const isTracking = isTrackingRelated(key);
                    const emoji = isTracking ? '🎯' : type === 'function' ? '🔧' : type === 'object' ? '📦' : '•';
                    const color = isTracking ? 'color: orange; font-weight: bold' : '';

                    if (isTracking || depth < 2) {
                        if (type === 'function') {
                            console.log(`%c${indent}${emoji} ${key}()`, color);
                        } else if (type === 'object' && value !== null) {
                            const constructorName = value.constructor?.name || 'Object';
                            console.log(`%c${indent}${emoji} ${key}: ${constructorName}`, color, value);

                            // Recursively inspect tracking-related objects
                            if (isTracking || depth < 1) {
                                recursiveInspect(value, key, depth + 1, maxDepth);
                            }
                        } else {
                            console.log(`%c${indent}${emoji} ${key}: ${type}`, color);
                        }
                    }
                } catch (e) {
                    // Can't access property
                }
            });
        }

        function deepInspectPlugin(pluginClass, pluginName) {
            console.log(`\n%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'color: #666');
            console.log(`%c🔎 ${pluginName}`, 'font-size: 18px; font-weight: bold; color: #FF6B6B; background: #000; padding: 5px');
            console.log(`%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'color: #666');

            if (!pluginClass) {
                console.log('❌ Plugin not found');
                return;
            }

            console.log('📦 Class:', pluginClass);

            // Clear inspected set for each plugin
            inspected = new WeakSet();

            console.log('\n🔍 RECURSIVE INSPECTION (depth 3):');
            recursiveInspect(pluginClass, pluginName, 0, 3);

            console.log('\n🔍 PROTOTYPE INSPECTION:');
            if (pluginClass.prototype) {
                recursiveInspect(pluginClass.prototype, `${pluginName}.prototype`, 0, 2);
            }
        }

        // ============================================
        // UPDATE FINGER UI
        // ============================================
        function updateFingerUI() {
            if (!arPlugin || !inAR) {
                fingerIndexEl.textContent = '-';
                fingerResultEl.textContent = '-';
                return;
            }

            // Update finger index
            fingerIndexEl.textContent = arPlugin.finger;

            // Update getCurrentFinger() result
            if (typeof arPlugin.getCurrentFinger === 'function') {
                try {
                    const result = arPlugin.getCurrentFinger();
                    if (result && typeof result === 'object') {
                        fingerResultEl.textContent = JSON.stringify(result, null, 2);
                    } else {
                        fingerResultEl.textContent = String(result);
                    }
                } catch (e) {
                    fingerResultEl.textContent = 'Error: ' + e.message;
                }
            } else {
                fingerResultEl.textContent = 'getCurrentFinger() not available';
            }
        }

        // ============================================
        // UPDATE CAMERA UI (SDK Internal)
        // ============================================
        function updateCameraUI() {
            if (!arPlugin || !inAR) {
                pluginNameEl.textContent = '-';
                mediaSettingsEl.textContent = '-';
                facingModeEl.textContent = '-';
                return;
            }

            // Plugin name
            const pluginName = arPlugin.constructor?.name || 'RingTryonPlugin';
            pluginNameEl.textContent = pluginName;

            // mediaSettings
            if (arPlugin.mediaSettings) {
                mediaSettingsEl.textContent = JSON.stringify(arPlugin.mediaSettings, null, 2);

                // facingMode
                const facingMode = arPlugin.mediaSettings.facingMode
                    || arPlugin.mediaSettings.video?.facingMode
                    || 'N/A';
                facingModeEl.textContent = facingMode;
            } else {
                mediaSettingsEl.textContent = 'mediaSettings not available';
                facingModeEl.textContent = 'N/A';
            }
        }

        // ============================================
        // STEP 1: INSPECT SDK
        // ============================================
        inspectBtn.addEventListener('click', () => {
            console.clear();
            console.log('%c🔍 iJEWEL SDK DEEP INSPECTION REPORT', 'font-size: 24px; font-weight: bold; color: #4CAF50; background: #000; padding: 10px');
            console.log('═'.repeat(100));

            // Check ij_vto
            console.log('\n%c📦 1. SDK GLOBAL OBJECTS', 'font-size: 18px; font-weight: bold; color: #2196F3');
            console.log('─'.repeat(100));

            if (window.ij_vto) {
                console.log('✅ window.ij_vto =>', window.ij_vto);
                const keys = Object.keys(window.ij_vto);
                console.log(`   Found ${keys.length} plugins:`, keys);

                // Deep inspect each plugin
                console.log('\n%c═══ DEEP INSPECTION OF EACH PLUGIN ═══', 'font-size: 18px; font-weight: bold; color: #E91E63');

                keys.forEach(key => {
                    deepInspectPlugin(window.ij_vto[key], key);
                });

            } else {
                console.log('❌ window.ij_vto NOT FOUND');
            }

            // Check external libraries
            console.log('\n%c🤖 2. EXTERNAL TRACKING LIBRARIES', 'font-size: 18px; font-weight: bold; color: #2196F3');
            console.log('─'.repeat(100));
            console.log('MediaPipe Hands (window.Hands):', window.Hands ? '✅ LOADED' : '❌ Not loaded');
            console.log('TensorFlow.js (window.tf):', window.tf ? `✅ LOADED (version ${window.tf?.version?.tfjs})` : '❌ Not loaded');

            // Check webgi
            console.log('\n%c🎨 3. WEBGI ENGINE', 'font-size: 18px; font-weight: bold; color: #2196F3');
            console.log('─'.repeat(100));
            console.log('window.webgi =>', window.webgi ? '✅ Available' : '❌ Not found');
            if (window.webgi) {
                const webgiKeys = Object.keys(window.webgi).filter(k => !k.startsWith('_'));
                console.log('   Keys (first 20):', webgiKeys.slice(0, 20));
            }

            console.log('\n%c💡 NEXT STEP:', 'font-size: 16px; font-weight: bold; color: #FF9800');
            console.log('─'.repeat(100));
            console.log('Click "2. Start AR & Monitor" to see what models are loaded during AR startup');
            console.log('═'.repeat(100));
        });

        // ============================================
        // INIT VIEWER
        // ============================================
        async function initViewer() {
            console.log('%c🎬 Initializing viewer...', 'color: cyan; font-weight: bold');

            window.addEventListener('ijewel-file-data', (event) => {
                console.log('📦 File data received:', event.detail.iJewelFileData?.config);
            });

            await window.ijewelViewer.loadModelById(fileId, basename, container, {
                showUiButtons: false,
                hideTryOn: true
            });

            window.addEventListener('ijewel-viewer-ready', async (event) => {
                viewerApp = event.detail.viewer;
                console.log('✅ Viewer ready:', viewerApp);

                // Enable AR button
                arBtn.disabled = false;
                arBtn.style.opacity = '1';
                arBtn.textContent = '2. Start AR & Monitor';

                console.log('%c✅ Ready! Click "2. Start AR & Monitor" to begin inspection', 'color: #4CAF50; font-weight: bold; font-size: 14px');
            });
        }

        // ============================================
        // START AR
        // ============================================
        async function startAR() {
            if (!window.ij_vto) {
                console.error('❌ WebVTO not loaded');
                alert('❌ WebVTO not loaded');
                return;
            }

            if (!viewerApp) {
                console.error('❌ Viewer not ready yet. Wait a few seconds and try again.');
                alert('❌ Viewer chưa sẵn sàng!\nĐợi 2-3 giây rồi bấm lại.');
                return;
            }

            console.log('\n\n');
            console.log('%c🚀 STARTING AR - MONITORING PLUGIN', 'font-size: 20px; font-weight: bold; color: #E91E63; background: #000; padding: 10px');
            console.log('═'.repeat(100));

            // Clear previous requests
            networkRequests.length = 0;

            console.log('%c⏳ Loading AR plugin...', 'font-size: 16px; color: yellow');
            arPlugin = await viewerApp.addPlugin(window.ij_vto.RingTryonPlugin);

            console.log('\n%c✅ AR PLUGIN LOADED', 'font-size: 18px; font-weight: bold; color: #4CAF50');
            console.log('─'.repeat(100));
            console.log('arPlugin instance =>', arPlugin);

            // ============================================
            // DEEP RECURSIVE INSPECTION OF AR PLUGIN INSTANCE
            // ============================================
            console.log('\n%c🔬 DEEP RECURSIVE INSPECTION OF AR PLUGIN INSTANCE:', 'font-size: 18px; font-weight: bold; color: #E91E63; background: #000; padding: 5px');
            console.log('═'.repeat(100));

            inspected = new WeakSet();
            recursiveInspect(arPlugin, 'arPlugin', 0, 4);

            // ============================================
            // INSPECT VIEWER APP
            // ============================================
            console.log('\n%c🔬 VIEWER APP INSPECTION:', 'font-size: 18px; font-weight: bold; color: #9C27B0; background: #000; padding: 5px');
            console.log('═'.repeat(100));
            console.log('viewerApp =>', viewerApp);

            inspected = new WeakSet();
            recursiveInspect(viewerApp, 'viewerApp', 0, 3);

            // ============================================
            // INSPECT ALL PLUGINS IN VIEWER
            // ============================================
            console.log('\n%c🔬 ALL PLUGINS IN VIEWER:', 'font-size: 18px; font-weight: bold; color: #FF9800; background: #000; padding: 5px');
            console.log('═'.repeat(100));

            if (viewerApp.plugins) {
                console.log('Plugins:', viewerApp.plugins);

                // Check if it's an array or object
                if (Array.isArray(viewerApp.plugins)) {
                    viewerApp.plugins.forEach((plugin, i) => {
                        console.log(`\n📦 Plugin ${i}:`, plugin);
                        inspected = new WeakSet();
                        recursiveInspect(plugin, `plugin[${i}]`, 0, 3);
                    });
                } else {
                    console.log('Plugins is not an array, inspecting as object:');
                    inspected = new WeakSet();
                    recursiveInspect(viewerApp.plugins, 'viewerApp.plugins', 0, 3);
                }
            } else {
                console.log('⚠️ viewerApp.plugins not found');
            }

            // ============================================
            // INSPECT CANVAS ELEMENTS
            // ============================================
            console.log('\n%c🔬 CANVAS ELEMENTS INSPECTION:', 'font-size: 18px; font-weight: bold; color: #00BCD4; background: #000; padding: 5px');
            console.log('═'.repeat(100));

            const canvases = document.querySelectorAll('canvas');
            console.log(`Found ${canvases.length} canvas element(s)`);

            canvases.forEach((canvas, i) => {
                console.log(`\n🎨 Canvas ${i}:`, canvas);
                console.log(`   Width: ${canvas.width}x${canvas.height}`);
                console.log(`   Style: ${canvas.style.cssText}`);

                // Try to get WebGL context info
                try {
                    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                    if (gl) {
                        console.log('   WebGL Context:', gl);
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (debugInfo) {
                            console.log('   GPU:', gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
                        }
                    }
                } catch (e) {
                    // ignore
                }

                inspected = new WeakSet();
                recursiveInspect(canvas, `canvas[${i}]`, 0, 2);
            });

            console.log('\n%c⏳ Starting AR camera...', 'font-size: 16px; color: yellow');
            await arPlugin.start();

            console.log('\n%c✅ AR STARTED - Waiting 3s for tracking to initialize...', 'font-size: 18px; font-weight: bold; color: #4CAF50');
            console.log('─'.repeat(100));

            // Wait for tracking to initialize
            setTimeout(() => {
                console.log('\n\n');
                console.log('%c═════════════════════════════════════════════════════════════════════════════════════════════', 'color: #FFD700');
                console.log('%c🔬 POST-AR-START INSPECTION (After 3 seconds)', 'font-size: 20px; font-weight: bold; color: #FFD700; background: #000; padding: 10px');
                console.log('%c═════════════════════════════════════════════════════════════════════════════════════════════', 'color: #FFD700');

                // ============================================
                // NETWORK REQUESTS
                // ============================================
                console.log('\n%c📊 NETWORK REQUESTS SUMMARY:', 'font-size: 16px; font-weight: bold; color: #2196F3');
                console.log('─'.repeat(100));
                if (networkRequests.length > 0) {
                    console.log(`%c⚠️ Found ${networkRequests.length} tracking-related network requests:`, 'color: orange; font-weight: bold');
                    networkRequests.forEach((url, i) => {
                        const isTFLite = url.includes('.tflite');
                        const isWasm = url.includes('.wasm');
                        const isMediaPipe = url.includes('mediapipe');
                        const emoji = isTFLite ? '🧠' : isWasm ? '⚙️' : isMediaPipe ? '🤖' : '📦';
                        console.log(`   ${emoji} ${i + 1}. ${url}`);
                    });
                } else {
                    console.log('✅ NO external tracking model requests detected');
                    console.log('   → SDK likely uses built-in tracking OR lazy-loads on demand');
                }

                // ============================================
                // RE-INSPECT PLUGIN AFTER START
                // ============================================
                console.log('\n%c🔬 AR PLUGIN STATE AFTER START:', 'font-size: 16px; font-weight: bold; color: #E91E63');
                console.log('─'.repeat(100));
                console.log('arPlugin instance =>', arPlugin);

                inspected = new WeakSet();
                console.log('\n🔍 Tracking-related properties only:');
                recursiveInspect(arPlugin, 'arPlugin', 0, 5); // Depth 5 for thorough search

                // ============================================
                // CHECK FOR COMMON TRACKING PROPERTIES
                // ============================================
                console.log('\n%c🎯 CHECKING COMMON TRACKING PROPERTY NAMES:', 'font-size: 16px; font-weight: bold; color: #FF9800');
                console.log('─'.repeat(100));

                const commonTrackingProps = [
                    'handTracker', 'handDetector', 'handTracking',
                    'tracker', 'detector', 'tracking',
                    'mediaPipe', 'mediapipe', 'mp',
                    'tensorFlow', 'tensorflow', 'tfjs', 'tf',
                    'model', 'models', 'mlModel',
                    'handLandmarks', 'landmarks',
                    'camera', 'video', 'stream',
                    'fingerTracker', 'fingerDetector'
                ];

                const foundTracking = [];
                commonTrackingProps.forEach(prop => {
                    if (arPlugin[prop] !== undefined) {
                        foundTracking.push({ prop, value: arPlugin[prop], type: typeof arPlugin[prop] });
                    }
                    // Also check with underscore prefix (private props)
                    if (arPlugin['_' + prop] !== undefined) {
                        foundTracking.push({ prop: '_' + prop, value: arPlugin['_' + prop], type: typeof arPlugin['_' + prop] });
                    }
                });

                if (foundTracking.length > 0) {
                    console.log('%c🎯 FOUND TRACKING PROPERTIES:', 'color: orange; font-weight: bold; font-size: 14px');
                    foundTracking.forEach(({ prop, value, type }) => {
                        console.log(`   • ${prop}:`, type, value);
                        if (type === 'object' && value !== null) {
                            inspected = new WeakSet();
                            recursiveInspect(value, prop, 1, 3);
                        }
                    });
                } else {
                    console.log('ℹ️ No common tracking property names found');
                    console.log('   Tracking may be abstracted behind SDK internal methods');
                }

                // ============================================
                // EXPOSE GLOBALS
                // ============================================
                window.arPlugin = arPlugin;
                window.viewerApp = viewerApp;

                console.log('\n%c💡 EXPOSED TO WINDOW:', 'font-size: 16px; font-weight: bold; color: #4CAF50');
                console.log('─'.repeat(100));
                console.log('   window.arPlugin =>', arPlugin);
                console.log('   window.viewerApp =>', viewerApp);
                console.log('\n   Try in console:');
                console.log('   • arPlugin.finger');
                console.log('   • arPlugin.modelRotation');
                console.log('   • Object.keys(arPlugin)');
                console.log('   • for (let k in arPlugin) { console.log(k, arPlugin[k]) }');

                console.log('\n%c═════════════════════════════════════════════════════════════════════════════════════════════', 'color: #FFD700');
                console.log('%c✅ INSPECTION COMPLETE', 'font-size: 20px; font-weight: bold; color: #4CAF50; background: #000; padding: 10px');
                console.log('%c═════════════════════════════════════════════════════════════════════════════════════════════', 'color: #FFD700');
            }, 3000);

            inAR = true;

            // Enable finger test button
            fingerBtn.disabled = false;
            fingerBtn.style.opacity = '1';

            // Enable switch finger button
            switchFingerBtn.disabled = false;
            switchFingerBtn.style.opacity = '1';

            // Enable camera buttons
            cameraBtn.disabled = false;
            cameraBtn.style.opacity = '1';
            flipBtn.disabled = false;
            flipBtn.style.opacity = '1';
            listApiBtn.disabled = false;
            listApiBtn.style.opacity = '1';

            // Show finger panel and update UI
            fingerPanel.classList.add('active');
            updateFingerUI();

            // Show camera panel and update UI
            cameraPanel.classList.add('active');
            updateCameraUI();
        }

        async function stopAR() {
            if (arPlugin) {
                await arPlugin.stop();
                inAR = false;
                console.log('⏹️ AR stopped');

                // Disable finger test button
                fingerBtn.disabled = true;
                fingerBtn.style.opacity = '0.5';

                // Disable switch finger button
                switchFingerBtn.disabled = true;
                switchFingerBtn.style.opacity = '0.5';

                // Disable camera buttons
                cameraBtn.disabled = true;
                cameraBtn.style.opacity = '0.5';
                flipBtn.disabled = true;
                flipBtn.style.opacity = '0.5';
                listApiBtn.disabled = true;
                listApiBtn.style.opacity = '0.5';

                // Hide finger panel
                fingerPanel.classList.remove('active');

                // Hide camera panel
                cameraPanel.classList.remove('active');
            }
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        arBtn.addEventListener('click', async () => {
            if (inAR) {
                arBtn.disabled = true;
                arBtn.textContent = 'Stopping...';
                await stopAR();
                arBtn.textContent = '2. Start AR & Monitor';
                arBtn.disabled = false;
            } else {
                arBtn.disabled = true;
                arBtn.textContent = 'Starting AR...';
                try {
                    await startAR();
                    arBtn.textContent = 'Stop AR';
                } catch (err) {
                    console.error('❌ AR start failed:', err);
                    alert('❌ Lỗi khi start AR: ' + err.message);
                    arBtn.textContent = '2. Start AR & Monitor';
                } finally {
                    arBtn.disabled = false;
                }
            }
        });

        // ============================================
        // TEST FINGER ORDER
        // ============================================
        fingerBtn.addEventListener('click', async () => {
            if (!arPlugin || !inAR) {
                alert('⚠️ Cần Start AR trước!');
                return;
            }

            console.clear();
            console.log('%c🖐️ FINGER ORDER TEST', 'font-size: 24px; font-weight: bold; color: #E91E63; background: #000; padding: 10px');
            console.log('═'.repeat(100));

            // 1. Check current finger
            console.log('\n%c📍 CURRENT STATE:', 'font-size: 18px; font-weight: bold; color: #2196F3');
            console.log('─'.repeat(100));
            console.log('arPlugin.finger =>', arPlugin.finger);

            if (typeof arPlugin.getCurrentFinger === 'function') {
                console.log('arPlugin.getCurrentFinger() =>', arPlugin.getCurrentFinger());
            } else {
                console.log('⚠️ getCurrentFinger() not available as function');
            }

            // 2. Test all finger indices
            console.log('\n%c🔄 TESTING ALL FINGER INDICES (0-4):', 'font-size: 18px; font-weight: bold; color: #FF9800');
            console.log('─'.repeat(100));

            const originalFinger = arPlugin.finger;
            const fingerResults = [];

            for (let i = 0; i < 5; i++) {
                arPlugin.finger = i;

                // Wait a bit for SDK to process
                await new Promise(r => setTimeout(r, 100));

                const result = {
                    index: i,
                    fingerProperty: arPlugin.finger,
                    getCurrentFinger: typeof arPlugin.getCurrentFinger === 'function' ? arPlugin.getCurrentFinger() : 'N/A'
                };

                fingerResults.push(result);
                console.log(`   Finger ${i}:`, result);
            }

            // 3. Show summary table
            console.log('\n%c📊 FINGER ORDER SUMMARY:', 'font-size: 18px; font-weight: bold; color: #4CAF50');
            console.log('─'.repeat(100));
            console.table(fingerResults);

            // 4. Inspect getCurrentFinger structure
            console.log('\n%c🔬 getCurrentFinger() INSPECTION:', 'font-size: 18px; font-weight: bold; color: #9C27B0');
            console.log('─'.repeat(100));

            if (typeof arPlugin.getCurrentFinger === 'function') {
                // Try to get function source
                try {
                    const funcStr = arPlugin.getCurrentFinger.toString();
                    console.log('Function source (first 500 chars):');
                    console.log(funcStr.substring(0, 500));

                    // Test what getCurrentFinger returns for each index
                    console.log('\n📋 getCurrentFinger() return values:');
                    for (let i = 0; i < 5; i++) {
                        arPlugin.finger = i;
                        await new Promise(r => setTimeout(r, 50));
                        const fingerData = arPlugin.getCurrentFinger();
                        console.log(`   finger=${i} → getCurrentFinger():`, fingerData);

                        // If it's an object, inspect deeper
                        if (fingerData && typeof fingerData === 'object') {
                            console.log('      Properties:', Object.keys(fingerData));
                            console.log('      Full data:', JSON.stringify(fingerData, null, 2));
                        }
                    }
                } catch (e) {
                    console.log('❌ Could not inspect:', e.message);
                }
            }

            // 5. Check for finger name mapping in SDK
            console.log('\n%c🏷️ CHECKING FOR FINGER NAME MAPPING:', 'font-size: 18px; font-weight: bold; color: #00BCD4');
            console.log('─'.repeat(100));

            const possibleFingerProps = ['fingerNames', 'FINGER_NAMES', 'fingerLabels', 'FINGERS', 'fingerMap', 'fingerMapping'];
            possibleFingerProps.forEach(prop => {
                if (arPlugin[prop]) {
                    console.log(`✅ Found arPlugin.${prop}:`, arPlugin[prop]);
                }
                if (window.ij_vto?.RingTryonPlugin?.[prop]) {
                    console.log(`✅ Found RingTryonPlugin.${prop}:`, window.ij_vto.RingTryonPlugin[prop]);
                }
            });

            // 6. Restore original finger
            arPlugin.finger = originalFinger;
            console.log('\n✅ Restored finger to:', originalFinger);

            console.log('\n%c═════════════════════════════════════════════════════════════════════════════════════════════', 'color: #E91E63');
            console.log('%c✅ FINGER TEST COMPLETE', 'font-size: 20px; font-weight: bold; color: #4CAF50; background: #000; padding: 10px');
            console.log('%c═════════════════════════════════════════════════════════════════════════════════════════════', 'color: #E91E63');
        });

        // ============================================
        // SWITCH FINGER BUTTON
        // ============================================
        switchFingerBtn.addEventListener('click', () => {
            if (!arPlugin || !inAR) {
                alert('⚠️ Cần Start AR trước!');
                return;
            }

            // Switch to next finger (0 → 1 → 2 → 3 → 4 → 0)
            arPlugin.finger = (arPlugin.finger + 1) % 5;

            // Update UI
            updateFingerUI();

            console.log('🖐️ Switched to finger:', arPlugin.finger);
        });

        // ============================================
        // TEST CAMERA API
        // ============================================
        cameraBtn.addEventListener('click', () => {
            if (!arPlugin || !inAR) {
                alert('⚠️ Cần Start AR trước!');
                return;
            }

            console.clear();
            console.log('%c📷 CAMERA API TEST', 'font-size: 24px; font-weight: bold; color: #2196F3; background: #000; padding: 10px');
            console.log('═'.repeat(80));

            // Check ALL properties on arPlugin
            console.log('\n%c🔍 Searching for camera-related properties...', 'font-size: 16px; font-weight: bold; color: #FF9800');
            console.log('─'.repeat(80));

            const cameraKeywords = ['camera', 'facing', 'front', 'back', 'video', 'media', 'stream', 'constraint'];
            const foundProps = [];

            // Check all own properties
            for (let key in arPlugin) {
                const keyLower = key.toLowerCase();
                if (cameraKeywords.some(kw => keyLower.includes(kw))) {
                    foundProps.push({ key, value: arPlugin[key], type: typeof arPlugin[key] });
                }
            }

            // Also check common camera property names directly
            const commonCameraProps = [
                'mediaSettings', 'cameraFacing', 'facingMode', 'isFrontCamera', 'isBackCamera',
                'camera', 'currentCamera', 'cameraMode', 'cameraIndex', 'cameraId',
                'videoConstraints', 'mediaConstraints', 'streamConstraints',
                'frontCamera', 'backCamera', 'facing', 'cameraType'
            ];

            commonCameraProps.forEach(prop => {
                if (arPlugin[prop] !== undefined && !foundProps.find(p => p.key === prop)) {
                    foundProps.push({ key: prop, value: arPlugin[prop], type: typeof arPlugin[prop] });
                }
            });

            if (foundProps.length > 0) {
                console.log('%c✅ FOUND CAMERA PROPERTIES:', 'color: #4CAF50; font-weight: bold; font-size: 14px');
                foundProps.forEach(({ key, value, type }) => {
                    console.log(`   • arPlugin.${key} (${type}):`, value);
                    if (type === 'object' && value !== null) {
                        console.log('     Details:', JSON.stringify(value, null, 2));
                    }
                });
            } else {
                console.log('⚠️ No camera properties found with common names');
            }

            // Check mediaSettings specifically
            console.log('\n%c📦 arPlugin.mediaSettings:', 'font-size: 16px; font-weight: bold; color: #9C27B0');
            console.log('─'.repeat(80));
            if (arPlugin.mediaSettings) {
                console.log(arPlugin.mediaSettings);
                console.log('Keys:', Object.keys(arPlugin.mediaSettings));

                // Check for facingMode in mediaSettings
                if (arPlugin.mediaSettings.facingMode) {
                    console.log('%c✅ facingMode found:', 'color: #4CAF50; font-weight: bold', arPlugin.mediaSettings.facingMode);
                }
                if (arPlugin.mediaSettings.video) {
                    console.log('%c✅ video settings:', 'color: #4CAF50; font-weight: bold', arPlugin.mediaSettings.video);
                }
            } else {
                console.log('❌ mediaSettings is undefined');
            }

            // Check for camera-related methods
            console.log('\n%c🔧 Camera-related METHODS:', 'font-size: 16px; font-weight: bold; color: #E91E63');
            console.log('─'.repeat(80));
            const cameraMethods = ['getCamera', 'getCameraFacing', 'getCurrentCamera', 'isFrontFacing', 'getFacingMode', 'getCameraType'];
            cameraMethods.forEach(method => {
                if (typeof arPlugin[method] === 'function') {
                    try {
                        const result = arPlugin[method]();
                        console.log(`✅ arPlugin.${method}() =`, result);
                    } catch (e) {
                        console.log(`⚠️ arPlugin.${method}() error:`, e.message);
                    }
                }
            });

            // Check flipCamera
            console.log('\n%c🔄 flipCamera method:', 'font-size: 16px; font-weight: bold; color: #00BCD4');
            console.log('─'.repeat(80));
            console.log('arPlugin.flipCamera:', typeof arPlugin.flipCamera);

            console.log('\n%c═══════════════════════════════════════════════════════════════════════════════════', 'color: #2196F3');
            console.log('%c📷 CAMERA TEST COMPLETE', 'font-size: 20px; font-weight: bold; color: #4CAF50; background: #000; padding: 10px');
            console.log('%c═══════════════════════════════════════════════════════════════════════════════════', 'color: #2196F3');
        });

        // ============================================
        // FLIP CAMERA BUTTON
        // ============================================
        flipBtn.addEventListener('click', async () => {
            if (!arPlugin || !inAR) {
                alert('⚠️ Cần Start AR trước!');
                return;
            }

            console.log('%c🔄 FLIPPING CAMERA...', 'font-size: 16px; font-weight: bold; color: #FF9800');

            // Log before flip
            console.log('Before flip - mediaSettings:', arPlugin.mediaSettings);

            await arPlugin.flipCamera();

            // Log after flip
            console.log('After flip - mediaSettings:', arPlugin.mediaSettings);

            // Update UI
            updateCameraUI();

            // Check if any property changed
            console.log('%c✅ Camera flipped! Check mediaSettings above for changes.', 'color: #4CAF50; font-weight: bold');
        });

        // ============================================
        // LIST ALL APIs (Deep Inspect) - Display on UI
        // ============================================
        function renderAPIList(filter = '') {
            const filterLower = filter.toLowerCase();
            // Only show camera-related APIs by default
            let filteredAPIs = allAPIsData.filter(api => api.isCameraRelated);

            // If user types in search, search within camera APIs
            if (filter) {
                filteredAPIs = filteredAPIs.filter(api =>
                    api.path.toLowerCase().includes(filterLower) ||
                    api.value.toLowerCase().includes(filterLower)
                );
            }

            // Render to UI
            apiList.innerHTML = filteredAPIs.map(api => {
                const indent = '&nbsp;&nbsp;'.repeat(api.depth);
                const prefix = api.depth > 0 ? '└─ ' : '';
                const className = api.isCameraRelated ? 'api-item camera' : 'api-item';
                const emoji = api.isCameraRelated ? '📷 ' : (api.type === 'function' ? '🔧 ' : '');

                return `<div class="${className}">
                    ${indent}${prefix}${emoji}<span class="path">${api.path}</span>
                    <span class="type">(${api.type})</span>
                    ${api.type !== 'function' && api.type !== 'object' ? `<span class="value">${api.value}</span>` : ''}
                </div>`;
            }).join('');

            // Update summary
            apiCamera.textContent = filteredAPIs.length;
            apiTotal.textContent = allAPIsData.length;
        }

        function showAPIPanel() {
            apiOverlay.classList.add('active');
            apiPanel.classList.add('active');
            apiSearch.value = '';
            apiSearch.focus();
        }

        function hideAPIPanel() {
            apiOverlay.classList.remove('active');
            apiPanel.classList.remove('active');
        }

        // Close panel on overlay click or close button
        apiOverlay.addEventListener('click', hideAPIPanel);
        document.getElementById('api-close').addEventListener('click', hideAPIPanel);

        // Search filter
        apiSearch.addEventListener('input', (e) => {
            renderAPIList(e.target.value);
        });

        // ESC to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && apiPanel.classList.contains('active')) {
                hideAPIPanel();
            }
        });

        listApiBtn.addEventListener('click', () => {
            if (!arPlugin || !inAR) {
                alert('⚠️ Cần Start AR trước!');
                return;
            }

            // Show loading
            apiList.innerHTML = '<div style="text-align:center;padding:20px;">Loading...</div>';
            showAPIPanel();

            // Use setTimeout to not block UI - runs ONCE only
            setTimeout(() => {
                const visited = new Set(); // Track visited paths to avoid cycles
                const cameraKeywords = ['camera', 'facing', 'front', 'back', 'video', 'stream', 'environment', 'user', 'media'];
                allAPIsData = [];
                const MAX_DEPTH = 4;

                function deepList(obj, path, depth = 0) {
                    if (depth > MAX_DEPTH) return;
                    if (!obj || typeof obj !== 'object') return;
                    if (visited.has(path)) return;
                    visited.add(path);

                    let keys = [];
                    try {
                        keys = Object.getOwnPropertyNames(obj);
                    } catch (e) { return; }

                    const uniqueKeys = keys.filter(k =>
                        k !== '__proto__' && k !== 'constructor' && !k.startsWith('_')
                    );

                    for (const key of uniqueKeys) {
                        try {
                            const value = obj[key];
                            const type = typeof value;
                            const fullPath = path ? `${path}.${key}` : key;
                            const isCameraRelated = cameraKeywords.some(kw =>
                                key.toLowerCase().includes(kw)
                            );

                            let displayValue = '';
                            if (type === 'function') {
                                displayValue = '';
                            } else if (type === 'object' && value !== null) {
                                displayValue = Array.isArray(value) ? `[${value.length}]` : '{...}';
                            } else if (type === 'string') {
                                displayValue = `"${value.substring(0, 30)}${value.length > 30 ? '...' : ''}"`;
                            } else {
                                displayValue = String(value);
                            }

                            allAPIsData.push({
                                path: fullPath,
                                type,
                                value: displayValue,
                                depth,
                                isCameraRelated
                            });

                            // Recurse into objects (not arrays, not functions)
                            if (type === 'object' && value !== null && !Array.isArray(value)) {
                                deepList(value, fullPath, depth + 1);
                            }
                        } catch (e) {}
                    }
                }

                // Start deep inspection
                deepList(arPlugin, 'arPlugin', 0);

                // Sort: camera-related first, then alphabetically
                allAPIsData.sort((a, b) => {
                    if (a.isCameraRelated && !b.isCameraRelated) return -1;
                    if (!a.isCameraRelated && b.isCameraRelated) return 1;
                    return a.path.localeCompare(b.path);
                });

                // Render
                renderAPIList();
                console.log('📋 Found', allAPIsData.length, 'APIs. Camera-related:', allAPIsData.filter(a => a.isCameraRelated).length);
            }, 50);
        });

        // Disable AR button until viewer ready
        arBtn.disabled = true;
        arBtn.style.opacity = '0.5';
        arBtn.textContent = '2. Start AR (Loading...)';

        // Auto init viewer
        initViewer();

        // Welcome message
        console.log('%c🔍 SDK INSPECTOR LOADED', 'font-size: 20px; font-weight: bold; color: #4CAF50');
        console.log('Click "1. Inspect SDK Structure" to start inspection');
        console.log('⏳ Waiting for 3D viewer to load...');
    </script>
